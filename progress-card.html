<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --card: #fffdf8a8;
      --card-2: #fffdf8db;
      --hair: #ffffffe6;
      --line: #1d1d1b17;
      --line-2: #1d1d1b29;
      --ink: #1d1d1b;
      --dim: #5c5a54;
      --faint: #75726a;
      --honey: #f6c343;
      --honey-ink: #5a4306;
      --night: #252523;
      --grey: #b9b6ad;
      --shadow: 0 1px 0 #fffc inset, 0 18px 40px -26px #3c321459;
      --font-display: "Outfit", system-ui, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      color: var(--ink);
      font: 400 14px/1.45 var(--font-body);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(90% 70% at 100% 100%, #f8d66e8c, #f8d66e00 70%),
        radial-gradient(60% 50% at 88% 0%, #fae4a080, #fae4a000 70%),
        linear-gradient(160deg, #f5f3ee, #f2efe6 55%, #fbeec0);
    }

    button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
    h2, p { margin: 0; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .ico {
      width: 18px; height: 18px; flex: none;
      fill: none; stroke: currentColor; stroke-width: 1.7px;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* ---------- Card ---------- */
    .pg {
      width: min(100%, 360px);
      padding: 20px;
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow), 0 0 0 1px var(--hair) inset;
    }

    .card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .card__title { font: 400 20px/1.2 var(--font-display); letter-spacing: -.01em; }

    .icon-btn {
      width: 38px; height: 38px; flex: none;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--card-2);
      box-shadow: 0 0 0 1px var(--line) inset;
      transition: box-shadow .3s var(--ease);
    }
    .icon-btn:hover { box-shadow: 0 0 0 1px var(--line-2) inset; }

    .pg__sum { display: flex; align-items: flex-start; gap: 14px; margin-top: 10px; }
    .big {
      font: 300 34px/1 var(--font-display);
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
    }
    .pg__cap { padding-top: 3px; color: var(--dim); font-size: 12px; line-height: 1.3; }

    /* ---------- Week chart ---------- */
    .week {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      height: 164px;
      margin-top: 18px;
      padding-top: 34px;
    }

    .day { display: grid; grid-template-rows: 1fr auto auto; justify-items: center; cursor: default; }
    .day:focus-visible { outline: none; }
    .day:focus-visible .day__lab { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }

    .day__track { position: relative; display: flex; align-items: flex-end; justify-content: center; width: 100%; }
    .day__stub {
      position: absolute; bottom: 0; left: 50%;
      width: 2px; height: 100%; margin-left: -1px;
      background: repeating-linear-gradient(var(--line-2) 0 3px, transparent 3px 7px);
    }
    .day__bar {
      position: relative;
      width: 7px;
      height: calc(var(--h) * 100%);
      border-radius: 6px;
      background: var(--night);
      transform-origin: 50% 100%;
      transition: opacity .3s;
    }
    .day__dot { width: 5px; height: 5px; margin: 8px 0 7px; border-radius: 50%; background: var(--night); }
    .day__lab { color: var(--faint); font-size: 11px; }

    .day.is-weekend .day__bar,
    .day.is-weekend .day__dot { background: var(--grey); }
    .day.is-today .day__bar { width: 9px; background: var(--honey); }
    .day.is-today .day__dot { background: var(--honey); }
    .day.is-hot .day__lab { color: var(--ink); font-weight: 600; }

    .week.is-hover .day:not(.is-hot) .day__bar { opacity: .35; }

    .week__tip {
      position: absolute; top: 0; left: 0; z-index: 2;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--honey);
      color: var(--honey-ink);
      font: 600 10.5px/1 var(--font-body);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
      transition: transform .45s var(--ease);
    }

    @media (prefers-reduced-motion: reduce) {
      .week__tip, .day__bar { transition: none; }
    }
  </style>
</head>
<body>

  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-arrow-ur" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
  </svg>

  <article class="pg" data-progress>
    <header class="card__head">
      <h2 class="card__title">Progress</h2>
      <button class="icon-btn" type="button" aria-label="Open progress report"><svg class="ico"><use href="#i-arrow-ur"/></svg></button>
    </header>
    <p class="pg__sum">
      <span class="big" data-avg>6.6 h</span>
      <span class="pg__cap">Avg. workday<br />last 7 days</span>
    </p>
    <div class="week" role="list" aria-label="Hours worked per day">
      <span class="week__tip" aria-live="polite"></span>
    </div>
  </article>

  <script>
  (() => {
    const root = document.querySelector('[data-progress]');
    if (!root) return;

    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const MAX_HOURS = 9; // a full-height bar

    // Last 7 days, oldest first. `off` = weekend, `today` = highlighted bar.
    const DAYS = [
      { d: 'W', name: 'Wednesday', h: 6.8 },
      { d: 'T', name: 'Thursday', h: 7.4 },
      { d: 'F', name: 'Friday', h: 5.2 },
      { d: 'S', name: 'Saturday', h: 1.1, off: true },
      { d: 'S', name: 'Sunday', h: 0.6, off: true },
      { d: 'M', name: 'Monday', h: 7.9 },
      { d: 'T', name: 'Tuesday (today)', h: 5.7, today: true },
    ];

    const fmt = (h) => {
      let hrs = Math.floor(h), min = Math.round((h % 1) * 60);
      if (min === 60) { hrs += 1; min = 0; }
      return `${hrs}h ${String(min).padStart(2, '0')}m`;
    };

    const week = root.querySelector('.week');
    const tip = root.querySelector('.week__tip');
    const avgEl = root.querySelector('[data-avg]');

    week.insertAdjacentHTML('beforeend', DAYS.map((day, i) => `
      <div class="day${day.off ? ' is-weekend' : ''}${day.today ? ' is-today' : ''}" role="listitem" tabindex="0" data-i="${i}"
           aria-label="${day.name}: ${fmt(day.h)}" style="--h:${Math.min(1, day.h / MAX_HOURS).toFixed(3)}">
        <span class="day__track"><i class="day__stub"></i><i class="day__bar"></i></span>
        <i class="day__dot"></i><span class="day__lab">${day.d}</span>
      </div>`).join(''));

    const days = [...week.querySelectorAll('.day')];
    const todayIndex = Math.max(0, DAYS.findIndex((d) => d.today));

    // "Avg. workday" averages working days only (weekends excluded).
    const workdays = DAYS.filter((d) => !d.off);
    const avg = workdays.reduce((s, d) => s + d.h, 0) / workdays.length;

    /* ---- Tooltip that glides to the hovered / focused bar ---- */
    function moveTip(i, animate = true) {
      const track = days[i].querySelector('.day__track');
      const bar = days[i].querySelector('.day__bar');
      tip.textContent = fmt(DAYS[i].h);

      let x = track.offsetLeft + bar.offsetLeft + bar.offsetWidth / 2 - tip.offsetWidth / 2;
      x = Math.max(0, Math.min(week.clientWidth - tip.offsetWidth, x));
      const y = Math.max(0, track.offsetTop + bar.offsetTop - tip.offsetHeight - 8);

      if (!animate) tip.style.transition = 'none';
      tip.style.transform = `translate(${x}px, ${y}px)`;
      if (!animate) { tip.getBoundingClientRect(); tip.style.transition = ''; }

      days.forEach((d, n) => d.classList.toggle('is-hot', n === i));
    }

    days.forEach((day, i) => {
      day.addEventListener('pointerenter', () => { week.classList.add('is-hover'); moveTip(i); });
      day.addEventListener('focus', () => moveTip(i));
      day.addEventListener('keydown', (e) => {
        const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!step) return;
        e.preventDefault();
        days[(i + step + days.length) % days.length].focus();
      });
    });
    week.addEventListener('pointerleave', () => { week.classList.remove('is-hover'); moveTip(todayIndex); });
    week.addEventListener('focusout', (e) => { if (!week.contains(e.relatedTarget)) moveTip(todayIndex); });

    /* ---- Count-up ---- */
    function countTo(el, to, { dur = 1200, decimals = 0, suffix = '' } = {}) {
      const show = (v) => { el.textContent = v.toFixed(decimals) + suffix; };
      if (reduce.matches) return show(to);
      const t0 = performance.now();
      (function step(now) {
        const p = Math.min(1, (now - t0) / dur);
        show(to * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      })(t0);
    }

    /* ---- Load-in: bars grow, tooltip pops onto today ---- */
    function intro() {
      moveTip(todayIndex, false);
      countTo(avgEl, avg, { decimals: 1, suffix: ' h' });
      if (reduce.matches) return;

      days.forEach((day, i) => {
        day.querySelector('.day__bar').animate(
          [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }],
          { duration: 900, delay: i * 50, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'backwards' }
        );
      });
      tip.animate(
        [{ opacity: 0, scale: .6 }, { opacity: 1, scale: 1 }],
        { duration: 500, delay: 600, easing: 'cubic-bezier(.34,2,.64,1)', fill: 'backwards' }
      );
    }

    intro();

    // Keep the tooltip aligned when fonts load or the width changes.
    const realign = () => moveTip(days.findIndex((d) => d.classList.contains('is-hot')), false);
    document.fonts?.ready.then(realign);
    let lastW = innerWidth;
    addEventListener('resize', () => { if (innerWidth !== lastW) { lastW = innerWidth; realign(); } });
  })();
  </script>
</body>
</html>
