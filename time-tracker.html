<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --card: #fffdf8a8;
      --card-2: #fffdf8db;
      --well: #efece4;
      --hair: #ffffffe6;
      --line: #1d1d1b17;
      --line-2: #1d1d1b29;
      --ink: #1d1d1b;
      --dim: #5c5a54;
      --honey: #f6c343;
      --honey-ink: #5a4306;
      --night: #252523;
      --night-ink: #f4f2ec;
      --ok: #3f8f5a;
      --shadow: 0 1px 0 #fffc inset, 0 18px 40px -26px #3c321459;
      --font-display: "Outfit", system-ui, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --back: cubic-bezier(.34, 1.7, .64, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      color: var(--ink);
      font: 400 14px/1.45 var(--font-body);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(90% 70% at 100% 100%, #f8d66e8c, #f8d66e00 70%),
        radial-gradient(60% 50% at 88% 0%, #fae4a080, #fae4a000 70%),
        linear-gradient(160deg, #f5f3ee, #f2efe6 55%, #fbeec0);
    }

    button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
    h2, p { margin: 0; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .ico {
      width: 18px; height: 18px; flex: none;
      fill: none; stroke: currentColor; stroke-width: 1.7px;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* ---------- Card ---------- */
    .tt {
      width: min(100%, 460px);
      min-height: 370px;
      display: flex;
      flex-direction: column;
      padding: 20px;
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow), 0 0 0 1px var(--hair) inset;
    }

    .tt__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tt__title { font: 400 20px/1.2 var(--font-display); letter-spacing: -.01em; }

    .icon-btn {
      width: 38px; height: 38px; flex: none;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--card-2);
      box-shadow: 0 0 0 1px var(--line) inset;
      transition: box-shadow .3s var(--ease);
    }
    .icon-btn:hover { box-shadow: 0 0 0 1px var(--line-2) inset; }

    /* ---------- Dial ---------- */
    .dial { position: relative; width: min(100%, 216px); aspect-ratio: 1; margin: 6px auto 0; }
    .dial svg { width: 100%; height: 100%; overflow: visible; }

    .dial__ticks line { stroke: var(--line-2); stroke-width: 1.4px; stroke-linecap: round; transition: stroke .25s; }
    .dial__ticks line.is-lit { stroke: var(--ink); }

    .dial__track { fill: none; stroke: var(--well); stroke-width: 14px; }
    .dial__arc {
      fill: none; stroke: var(--honey); stroke-width: 14px; stroke-linecap: round;
      stroke-dasharray: 100 100; stroke-dashoffset: 100;
      transform: rotate(-90deg); transform-origin: 100px 100px;
      transition: stroke-dashoffset .6s var(--ease);
    }
    .dial__sweep { transform-origin: 100px 100px; transition: transform .45s var(--back); }
    .dial__sweep circle { fill: var(--ink); }

    .dial__read { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }

    .clock {
      display: flex; justify-content: center;
      font: 300 38px/1 var(--font-display);
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
    }
    .clock__sep { width: .3em; text-align: center; }

    .dial__cap { margin-top: 6px; color: var(--dim); font-size: 11.5px; }
    .dial__state { font-weight: 600; transition: color .3s; }
    .tt.is-running .dial__state { color: var(--ok); }
    .clock__sec { display: inline-flex; vertical-align: bottom; font-variant-numeric: tabular-nums; }

    /* Rolling digits */
    .dg { display: inline-block; height: 1em; overflow: hidden; }
    .dg__col { display: flex; flex-direction: column; transition: transform .5s var(--ease); }
    .dg__col span { height: 1em; line-height: 1; }

    /* ---------- Controls ---------- */
    .tt__ctrls { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 10px; }

    .ctrl-btn {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--card-2);
      box-shadow: 0 0 0 1px var(--line) inset;
      transition: background-color .3s, color .3s;
    }
    .ctrl-btn .ico { width: 17px; height: 17px; }
    .ctrl-btn .ico--play { fill: currentColor; stroke-width: 1.2px; }
    .ctrl-btn .ico--pause,
    .ctrl-btn[aria-pressed="true"] .ico--play { display: none; }
    .ctrl-btn[aria-pressed="true"] .ico--pause { display: block; }

    .ctrl-btn--dark { margin-left: auto; background: var(--night); color: var(--night-ink); box-shadow: none; }
    .ctrl-btn--dark[aria-pressed="true"] { background: var(--honey); color: var(--honey-ink); }

    @media (pointer: coarse) {
      .ctrl-btn, .icon-btn { width: 44px; height: 44px; }
    }

    /* While rewinding, digits and arc follow the counter frame by frame */
    .tt.is-scrub .dg__col,
    .tt.is-scrub .dial__arc { transition: none; }
    .tt.is-rewind .dial__sweep { transition: transform .9s cubic-bezier(.65, 0, .35, 1); }

    /* Load-in */
    .tt.is-intro .dial__arc { transition: stroke-dashoffset 1.4s cubic-bezier(.65, 0, .35, 1); }
    .tt.is-intro .dial__ticks line { animation: tick-in .3s linear both; animation-delay: calc(var(--i) * 12ms); }
    @keyframes tick-in { from { opacity: 0; } }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; left: 0; right: 0; bottom: 26px; z-index: 30;
      width: fit-content; max-width: calc(100vw - 32px); margin: 0 auto;
      padding: 12px 18px; border-radius: 999px;
      background: var(--night); color: var(--night-ink);
      font-size: 13px; font-weight: 500;
      box-shadow: 0 20px 40px -20px #0009;
      opacity: 0; transform: translateY(18px) scale(.96);
      pointer-events: none;
      transition: opacity .3s, transform .45s var(--back);
    }
    .toast.is-on { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      .dg__col, .dial__arc, .dial__sweep, .toast,
      .tt.is-intro .dial__arc, .tt.is-rewind .dial__sweep { transition: none; }
      .tt.is-intro .dial__ticks line { animation: none; }
    }
  </style>
</head>
<body>

  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-arrow-ur" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5L8 5.5Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 6v12M15.5 6v12"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5M5 4.5V8h3.5"/></symbol>
    <symbol id="i-alarm" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 9.5V13l2.5 1.5M4.5 5.5 7 3.5M19.5 5.5 17 3.5"/></symbol>
  </svg>

  <!--
    data-start       seconds already tracked on first load (9312 = 02:35:12)
    data-goal-hours  the dial fills against this working day
    data-persist     keep the stopwatch across reloads (localStorage)
  -->
  <article class="tt" data-tracker data-start="9312" data-goal-hours="8" data-persist>
    <header class="tt__head">
      <h2 class="tt__title">Time tracker</h2>
      <button class="icon-btn" type="button" aria-label="Open timesheet"><svg class="ico"><use href="#i-arrow-ur"/></svg></button>
    </header>

    <div class="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <g class="dial__ticks"></g>
        <circle class="dial__track" cx="100" cy="100" r="66" />
        <circle class="dial__arc" cx="100" cy="100" r="66" pathLength="100" />
        <g class="dial__sweep"><circle cx="100" cy="21" r="3.2" /></g>
      </svg>
      <div class="dial__read">
        <p class="clock" aria-label="Tracked today"></p>
        <p class="dial__cap"><span class="dial__state">Paused</span> · <span class="clock__sec"></span>s</p>
      </div>
    </div>

    <div class="tt__ctrls">
      <button class="ctrl-btn" type="button" data-toggle aria-label="Start timer" aria-pressed="false">
        <svg class="ico ico--play"><use href="#i-play"/></svg><svg class="ico ico--pause"><use href="#i-pause"/></svg>
      </button>
      <button class="ctrl-btn" type="button" data-reset aria-label="Reset today"><svg class="ico"><use href="#i-reset"/></svg></button>
      <button class="ctrl-btn ctrl-btn--dark" type="button" data-alarm aria-label="Set a break reminder" aria-pressed="false"><svg class="ico"><use href="#i-alarm"/></svg></button>
    </div>
  </article>

  <div class="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    const root = document.querySelector('[data-tracker]');
    if (!root) return;

    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const $ = (s) => root.querySelector(s);
    const GOAL = (+root.dataset.goalHours || 8) * 3600;
    const KEY = 'time-tracker:state';
    const persist = root.hasAttribute('data-persist');

    const clock = $('.clock');
    const secEl = $('.clock__sec');
    const arc = $('.dial__arc');
    const sweep = $('.dial__sweep');
    const ticksG = $('.dial__ticks');
    const stateEl = $('.dial__state');
    const toggleBtn = $('[data-toggle]');
    const resetBtn = $('[data-reset]');
    const alarmBtn = $('[data-alarm]');
    const toast = document.querySelector('.toast');

    /* ---- State: base seconds + start timestamp while running ---- */
    let base = +root.dataset.start || 0;
    let anchor = 0;
    let running = false;
    let shown = -1;
    let scrubbing = false;
    let sweepDeg = 0;

    if (persist) {
      try {
        const s = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (s && typeof s.base === 'number') ({ base, anchor, running } = s);
      } catch {}
    }
    const save = () => {
      if (!persist) return;
      try { localStorage.setItem(KEY, JSON.stringify({ base, anchor, running })); } catch {}
    };
    const current = () => base + (running ? Math.floor((Date.now() - anchor) / 1000) : 0);

    /* ---- Build: 60 ticks, rolling digit columns ---- */
    ticksG.innerHTML = Array.from({ length: 60 }, (_, t) => {
      const a = (t / 60) * Math.PI * 2 - Math.PI / 2;
      const r = t % 5 ? 86 : 83;
      const p = (rad) => [(100 + Math.cos(a) * rad).toFixed(2), (100 + Math.sin(a) * rad).toFixed(2)];
      const [x1, y1] = p(r), [x2, y2] = p(92);
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="--i:${t}"/>`;
    }).join('');
    const ticks = [...ticksG.querySelectorAll('line')];

    const roller = () =>
      `<span class="dg"><span class="dg__col">${[...'0123456789'].map((d) => `<span>${d}</span>`).join('')}</span></span>`;
    clock.innerHTML = roller() + roller() + '<span class="clock__sep">:</span>' + roller() + roller();
    secEl.innerHTML = roller() + roller();
    const cols = [...clock.querySelectorAll('.dg__col'), ...secEl.querySelectorAll('.dg__col')];

    /* ---- Render ---- */
    function setSweep(target) {
      // Always take the short way round so the dot never spins backwards on wrap.
      const d = (((target - sweepDeg) % 360) + 540) % 360 - 180;
      sweepDeg += d;
      sweep.style.transform = `rotate(${sweepDeg}deg)`;
    }

    function render(sec, { moveSweep = true } = {}) {
      sec = Math.max(0, Math.floor(sec));
      const h = String(Math.min(99, Math.floor(sec / 3600))).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      [...h, ...m, ...s].forEach((d, i) => { cols[i].style.transform = `translateY(${-d * 10}%)`; });
      clock.setAttribute('aria-label', `Tracked today ${h}:${m}`);

      const s60 = sec % 60;
      ticks.forEach((l, i) => l.classList.toggle('is-lit', running ? i <= s60 : i === s60));
      arc.style.strokeDashoffset = 100 - Math.min(1, sec / GOAL) * 100;
      if (moveSweep) setSweep(s60 * 6);
    }

    function pop(el) {
      if (reduce.matches) return;
      el.animate([{ transform: 'scale(.72)' }, { transform: 'scale(1)' }], { duration: 500, easing: 'cubic-bezier(.34,2,.64,1)' });
    }

    let toastTimer;
    function say(msg) {
      toast.textContent = msg;
      toast.classList.add('is-on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('is-on'), 2600);
    }

    /* ---- Behaviour ---- */
    function syncUI() {
      toggleBtn.setAttribute('aria-pressed', String(running));
      toggleBtn.setAttribute('aria-label', running ? 'Pause timer' : 'Start timer');
      root.classList.toggle('is-running', running);
      stateEl.textContent = running ? 'Tracking' : 'Paused';
    }

    function setRunning(on) {
      if (on === running) return;
      base = current();
      anchor = Date.now();
      running = on;
      syncUI();
      shown = base;
      render(base);
      save();
    }

    toggleBtn.addEventListener('click', () => {
      setRunning(!running);
      pop(toggleBtn.querySelector(running ? '.ico--pause' : '.ico--play'));
    });

    resetBtn.addEventListener('click', () => {
      pop(resetBtn.querySelector('.ico'));
      setRunning(false);
      const from = current();
      base = 0;
      save();

      if (reduce.matches || from === 0) { shown = 0; render(0); return; }

      scrubbing = true;
      root.classList.add('is-scrub', 'is-rewind');
      setSweep(0);
      const t0 = performance.now(), dur = 900;
      const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      (function frame(now) {
        const p = Math.min(1, (now - t0) / dur);
        render(from * (1 - ease(p)), { moveSweep: false });
        if (p < 1) return requestAnimationFrame(frame);
        root.classList.remove('is-scrub', 'is-rewind');
        scrubbing = false;
        shown = 0;
        render(0);
      })(t0);
    });

    let reminder;
    alarmBtn.addEventListener('click', () => {
      const on = alarmBtn.getAttribute('aria-pressed') !== 'true';
      alarmBtn.setAttribute('aria-pressed', String(on));
      alarmBtn.setAttribute('aria-label', on ? 'Turn off break reminder' : 'Set a break reminder');
      if (!reduce.matches) {
        alarmBtn.querySelector('.ico').animate(
          [{ transform: 'rotate(-18deg)' }, { transform: 'rotate(10deg)' }, { transform: 'rotate(-5deg)' }, { transform: 'rotate(0)' }],
          { duration: 700, easing: 'ease-out' }
        );
      }
      clearTimeout(reminder);
      if (on) {
        const at = new Date(Date.now() + 60 * 60 * 1000);
        reminder = setTimeout(() => {
          say('Time for a break');
          alarmBtn.setAttribute('aria-pressed', 'false');
        }, at - Date.now());
        say(`Break reminder set for ${at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`);
      } else {
        say('Break reminder off');
      }
    });

    // Timestamp-based, so it stays accurate in background tabs.
    setInterval(() => {
      if (scrubbing) return;
      const t = current();
      if (t !== shown) { shown = t; render(t); }
    }, 250);

    /* ---- Load-in: ticks fade round, arc fills, dot swings to the second ---- */
    syncUI();
    render(0);
    if (!reduce.matches) root.classList.add('is-intro');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      shown = current();
      render(shown);
      setTimeout(() => root.classList.remove('is-intro'), 1600);
    }));
  })();
  </script>
</body>
</html>
