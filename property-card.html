<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================
       Property — isometric buildings on a turntable; your floor glows
       ========================================================= */
    :root {
      --bg-a: #f3f8fc;
      --bg-b: #cfe3f3;
      --ink: #14161c;
      --text: #3c4352;
      --dim: #6c7586;
      --faint: #9aa3b2;
      --glass: rgba(255, 255, 255, .62);
      --glass-line: rgba(255, 255, 255, .9);
      --cream: #fdebd3;
      --accent: #ff8a3d;
      --live: #22b07d;
      --sans: 'Noto Sans', system-ui, sans-serif;
      --jp: 'Noto Sans JP', 'Noto Sans', sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --io: cubic-bezier(.65, 0, .35, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg-b); }
    body {
      min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: center; gap: 14px;
      padding: 36px 16px; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased;
      background: linear-gradient(180deg, var(--bg-a) 0%, #e4eff8 45%, var(--bg-b) 100%);
    }
    button, input, a { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .note { width: min(100%, 680px); color: #5f6b7c; font-size: 12px; line-height: 1.5; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .prop {
      position: relative; width: min(100%, 680px); padding: 24px 26px 26px; border-radius: 30px; overflow: hidden;
      background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.35));
      box-shadow: 0 0 0 1px var(--glass-line) inset, 0 30px 60px -30px rgba(40, 80, 120, .35);
      backdrop-filter: blur(14px);
    }

    /* Header */
    .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .head h1 { font-size: 24px; font-weight: 600; color: #3d4659; letter-spacing: .01em; }
    .head__r { display: flex; align-items: center; gap: 10px; }
    .count { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .count b { color: var(--ink); font-weight: 600; }
    .arrow { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.8); box-shadow: 0 0 0 1px rgba(20, 22, 28, .08) inset, 0 2px 6px rgba(40, 80, 120, .08); transition: transform .2s var(--ease), background-color .2s; }
    .arrow:hover { transform: translateY(-1px); background: #fff; }
    .arrow svg { width: 16px; height: 16px; }

    /* Stage */
    .stage { position: relative; height: 430px; margin-top: 18px; border-radius: 24px; overflow: hidden; touch-action: pan-y;
      background: radial-gradient(120% 80% at 50% 0%, #ffffff 0%, #eef3fb 55%, #e3ebf6 100%); box-shadow: 0 0 0 1px rgba(255,255,255,.9) inset; }
    .stage::after { content: ''; position: absolute; inset: auto 0 0; height: 40%; pointer-events: none; background: linear-gradient(180deg, transparent, rgba(207, 227, 243, .35)); }
    .sun { position: absolute; width: 220px; height: 220px; right: -40px; top: -60px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 220, 170, .55), transparent 65%); pointer-events: none; }
    .slide { position: absolute; left: 50%; top: 4px; width: 74%; height: calc(100% - 62px); margin-left: -37%;
      transform: translateX(calc(var(--o) * 64%)) scale(calc(1 - var(--a) * .42)); transform-origin: 50% 85%;
      opacity: calc(1 - var(--a) * .5); filter: saturate(calc(1 - var(--a) * .55)) blur(calc(var(--a) * 1px));
      transition: transform .8s var(--io), opacity .8s var(--io), filter .8s var(--io); cursor: pointer; z-index: calc(10 - var(--a)); }
    .slide[hidden] { display: block; visibility: hidden; opacity: 0; }
    .slide.is-current { cursor: default; }
    .slide svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .bld { transition: transform 1.1s var(--io), opacity .6s; }
    .prop.is-entering .slide.is-current .bld { transform: scale(var(--zoom, 3)); opacity: 0; transition: transform 1.1s cubic-bezier(.7, 0, .84, 0), opacity .5s .55s; }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-5px); } }
    .glow { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
    .floor-hit { fill: transparent; cursor: pointer; }
    .floor-hit:hover + .floor-hover, .floor-hover.is-on { opacity: 1; }
    .floor-hover { opacity: 0; transition: opacity .15s; pointer-events: none; }
    .pin { transition: opacity .4s; }
    .slide:not(.is-current) .pin, .prop.is-entering .pin { opacity: 0; }
    .pin-txt { font: 600 12px var(--sans); fill: var(--ink); }
    .pin-sub { font: 500 10px var(--sans); fill: var(--dim); }

    .dots { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 20; display: flex; gap: 6px; padding: 6px 8px; border-radius: 999px; background: rgba(255,255,255,.7); backdrop-filter: blur(8px); }
    .dots button { width: 7px; height: 7px; border-radius: 999px; background: rgba(20, 22, 28, .2); transition: width .4s var(--ease), background-color .3s; }
    .dots button[aria-current="true"] { width: 22px; background: var(--ink); }

    /* Info card */
    .info { position: relative; z-index: 21; margin: -46px 18px 0; padding: 16px 18px 16px; border-radius: 20px;
      background: var(--glass); backdrop-filter: blur(16px) saturate(1.3); box-shadow: 0 0 0 1px var(--glass-line) inset, 0 16px 34px -18px rgba(40, 80, 120, .45); }
    .info__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .name { font-size: 19px; font-weight: 700; letter-spacing: -.005em; }
    .floorbadge { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 600; }
    .floorbadge i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(255, 138, 61, .3); }
    .addr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; margin-top: 8px; }
    .addr p { color: var(--text); font-size: 14px; line-height: 1.5; }
    .addr small { display: block; color: var(--dim); font: 400 12px/1.5 var(--jp); }
    .tools { display: flex; gap: 6px; }
    .tool { position: relative; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: rgba(255,255,255,.75); box-shadow: 0 0 0 1px rgba(20, 22, 28, .07) inset; color: var(--text); text-decoration: none; transition: background-color .2s; }
    .tool:hover { background: #fff; }
    .tool svg { width: 16px; height: 16px; }
    .tool[data-done]::after { content: attr(data-done); position: absolute; bottom: calc(100% + 6px); right: 0; padding: 3px 7px; border-radius: 6px; background: var(--ink); color: #fff; font-size: 11px; white-space: nowrap; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(20, 22, 28, .08); color: var(--dim); font-size: 12.5px; }
    .meta span { display: inline-flex; align-items: center; gap: 6px; }
    .meta b { color: var(--ink); font-weight: 600; }
    .meta svg { width: 15px; height: 15px; color: var(--faint); }
    .faces { display: inline-flex; margin-right: 2px; }
    .faces i { width: 22px; height: 22px; margin-left: -6px; border-radius: 50%; display: grid; place-items: center; border: 2px solid #fff; background: var(--c); color: #fff; font: 600 9px/1 var(--sans); font-style: normal; }
    .faces i:first-child { margin-left: 0; }
    .live { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 rgba(34,176,125,.5); animation: live 2s infinite; }
    @keyframes live { 70%, 100% { box-shadow: 0 0 0 7px rgba(34,176,125,0); } }
    .rv { animation: up .6s var(--ease) both; animation-delay: calc(var(--d, 0) * 50ms); }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } }

    /* Actions */
    .actions { display: flex; justify-content: center; gap: 14px; margin-top: 22px; }
    .btn { display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 28px; border-radius: 999px; font-size: 16px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; transition: transform .25s var(--ease), box-shadow .25s; }
    .btn svg { width: 22px; height: 22px; transition: transform .3s var(--ease); }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0) scale(.98); }
    .btn--add { background: var(--cream); color: var(--ink); box-shadow: 0 10px 24px -14px rgba(180, 120, 40, .55), 0 0 0 1px rgba(255,255,255,.7) inset; }
    .btn--add:hover svg { transform: translateY(-2px); }
    .btn--enter { background: linear-gradient(135deg, #6a6a6e, #121214 70%); color: #fff; box-shadow: 0 12px 26px -12px rgba(0,0,0,.55); }
    .btn--enter:hover svg { transform: translateX(3px); }

    .toast { position: absolute; left: 50%; top: 50%; z-index: 30; transform: translate(-50%, -50%) scale(.96); padding: 14px 20px; border-radius: 16px; background: var(--ink); color: #fff; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .4s var(--ease); text-align: center; }
    .toast small { display: block; color: #b9bfcc; font-size: 12px; }
    .toast.is-on { opacity: 1; transform: translate(-50%, -50%); }

    /* Add property sheet */
    dialog { width: min(92vw, 420px); margin: auto; padding: 0; border: 0; border-radius: 24px; background: #fff; color: var(--ink); box-shadow: 0 40px 80px -30px rgba(20, 40, 70, .5); }
    dialog::backdrop { background: rgba(30, 50, 80, .25); backdrop-filter: blur(4px); }
    dialog[open] { animation: sheet .4s var(--ease); }
    @keyframes sheet { from { opacity: 0; transform: translateY(16px) scale(.98); } }
    .sheet { padding: 22px; }
    .sheet h2 { font-size: 18px; font-weight: 600; }
    .sheet p.lead { margin-top: 4px; color: var(--dim); font-size: 13px; }
    .field { display: grid; gap: 5px; margin-top: 14px; }
    .field label { font-size: 12.5px; color: var(--text); font-weight: 500; }
    .field input { height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid #dfe5ee; background: #f8fafc; font-size: 14px; }
    .field input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; background: #fff; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sheet__btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .sheet__btns button { height: 42px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 500; }
    .sheet__btns .ok { background: var(--ink); color: #fff; }
    .sheet__btns .no { box-shadow: 0 0 0 1px #dfe5ee inset; }

    @media (max-width: 560px) {
      .prop { padding: 18px 14px 18px; border-radius: 24px; }
      .head h1 { font-size: 20px; }
      .stage { height: 330px; }
      .slide { width: 86%; margin-left: -43%; }
      .info { margin: -40px 6px 0; padding: 14px; }
      .name { font-size: 17px; }
      .actions { gap: 10px; }
      .btn { height: 50px; padding: 0 18px; font-size: 13.5px; gap: 8px; }
      .btn svg { width: 18px; height: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .slide, .bld, .btn, .dots button { transition: none; }
      .float, .glow, .live, .rv { animation: none; }
    }
  </style>
</head>
<body>

  <section class="prop" data-prop aria-roledescription="carousel" aria-label="Properties"></section>
  <p class="note">Each building is drawn in code from its floor count, so it needs no photo, and the floor you’re on lights up. Hover the building to read its floors. Demo properties apart from the first are made up. Pass your own to <code>PropertyCard.mount()</code>.</p>

  <script>
  /* =============================================================
     PropertyCard — properties as isometric buildings on a turntable.
     PropertyCard.mount(el, {
       properties: [{
         id, name, postal, address, addressJa, building,
         floors: 9,                 // storeys in the building
         floor: 7,                  // your floor — it glows on the model
         seats: 40, here: ['AK','MS',…],  // initials of people in the office now
         palette: ['#f3c7dc', '#8e9cd8', '#a9dfe0'],  // left face, right face, roof edge
       }],
       onEnter(p), onAdd(p),
     })  →  { go(i), add(p) }
     ============================================================= */
  window.PropertyCard = (() => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const sv = (p, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
    const I = {
      prev: sv('<path d="M15 5l-7 7 7 7"/>'), next: sv('<path d="M9 5l7 7-7 7"/>'),
      layers: sv('<path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/><path d="m3 17.5 9 4.5 9-4.5" opacity=".0"/>', 1.7),
      enter: sv('<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M3 12h11M10 8l4 4-4 4"/>', 1.7),
      copy: sv('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'),
      map: sv('<path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4z"/><path d="M9 4v13.5M15 6.5V20"/>'),
      floors: sv('<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M5 8h14M5 13h14M10 21v-4h4v4"/>'),
      seats: sv('<path d="M6 11V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5"/><path d="M4 11h16v4H4zM7 15v5M17 15v5"/>'),
    };
    const FACE = ['#f2a65a', '#6aa5e8', '#a78bfa', '#f472b6', '#34b39a', '#e8a33d'];
    const seeded = (seed) => { let s = seed % 2147483647 || 7; return () => ((s = (s * 16807) % 2147483647), (s - 1) / 2147483646); };
    const hash = (str) => [...String(str)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
    const shade = (hex, t) => { const n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; return `rgb(${c.map((v) => Math.round(t < 0 ? v * (1 + t) : v + (255 - v) * t)).join(',')})`; };

    /* ---------- Isometric building ---------- */
    function building(p, uid) {
      const rnd = seeded(hash(p.id));
      const n = clamp(p.floors || 8, 2, 30);
      const w = p.w || (5 + Math.round(rnd() * 2)), d = p.d || (3.6 + Math.round(rnd() * 1.5));
      const s = 20, c30 = Math.cos(Math.PI / 6), s30 = 0.5;
      const gH = 1.5, fH = 1;                   // ground storey is taller
      const H = gH + (n - 1) * fH + 0.35;       // + parapet
      const P = (x, y, z) => [(x - y) * c30 * s, (x + y) * s30 * s - z * s];
      const pt = (a) => a.map((v) => v.toFixed(1)).join(' ');
      const poly = (pts, attrs) => `<path d="M${pts.map(pt).join('L')}Z" ${attrs}/>`;
      const [L, R, T] = p.palette || ['#f3c7dc', '#8e9cd8', '#a9dfe0'];
      const zOf = (f) => (f <= 1 ? 0 : gH + (f - 2) * fH);  // floor f's base height
      const hOf = (f) => (f <= 1 ? gH : fH);
      let out = '';

      // Ground plate + shadow
      const g = 2.2, gt = 0.35;
      out += poly([P(-g, -g, 0), P(w + g, -g, 0), P(w + g, d + g, 0), P(-g, d + g, 0)], `fill="url(#pl${uid})"`);
      out += poly([P(w + g, -g, 0), P(w + g, d + g, 0), P(w + g, d + g, -gt), P(w + g, -g, -gt)], 'fill="#b9c6df"');
      out += poly([P(-g, d + g, 0), P(w + g, d + g, 0), P(w + g, d + g, -gt), P(-g, d + g, -gt)], 'fill="#cfd8ea"');
      // pavement path to the door
      out += poly([P(w * 0.45, d, 0), P(w * 0.62, d, 0), P(w * 0.62, d + g, 0), P(w * 0.45, d + g, 0)], 'fill="#fff" opacity=".7"');
      out += `<ellipse cx="${pt(P(w / 2 + 0.6, d / 2 + 0.6, 0)).split(' ')[0]}" cy="${pt(P(w / 2 + 0.6, d / 2 + 0.6, 0)).split(' ')[1]}" rx="${(w + d) * s * 0.55}" ry="${(w + d) * s * 0.2}" fill="url(#sh${uid})"/>`;

      // Trees and lamps: behind first, then building, then front
      const tree = (x, y, k) => {
        const [bx, by] = P(x, y, 0), r = (0.9 + rnd() * 0.5) * s * k;
        return `<g><rect x="${(bx - 1.5).toFixed(1)}" y="${(by - r * 1.2).toFixed(1)}" width="3" height="${(r * 1.2).toFixed(1)}" fill="#7a6a5a"/>
          <circle cx="${bx.toFixed(1)}" cy="${(by - r * 1.5).toFixed(1)}" r="${r.toFixed(1)}" fill="#5fae6e"/>
          <circle cx="${(bx - r * 0.45).toFixed(1)}" cy="${(by - r * 1.25).toFixed(1)}" r="${(r * 0.7).toFixed(1)}" fill="#4f9d5f"/>
          <circle cx="${(bx + r * 0.3).toFixed(1)}" cy="${(by - r * 1.85).toFixed(1)}" r="${(r * 0.55).toFixed(1)}" fill="#7cc487"/></g>`;
      };
      const lamp = (x, y) => { const [bx, by] = P(x, y, 0), h = 3.4 * s; return `<path d="M${bx.toFixed(1)} ${by.toFixed(1)}V${(by - h).toFixed(1)}q0 -10 12 -10" fill="none" stroke="#8a93b8" stroke-width="2.2" stroke-linecap="round"/><circle cx="${(bx + 12).toFixed(1)}" cy="${(by - h - 9).toFixed(1)}" r="2.5" fill="#fff4c9"/>`; };
      const back = tree(-1.2, -1.1, 0.9) + tree(w + 1.2, -1.2, 0.8) + lamp(-1.6, d * 0.4);
      const front = tree(-1, d + 1.1, 1) + tree(w + 1.1, d * 0.55, 0.95) + tree(w * 0.25, d + 1.4, 0.8) + lamp(w + 1.9, d * 0.1) + `<g opacity=".9">${[[0.2, d + 0.5], [w - 0.4, d + 0.5], [w + 0.5, 0.3]].map(([x, y]) => { const [bx, by] = P(x, y, 0); return `<ellipse cx="${bx.toFixed(1)}" cy="${(by - 3).toFixed(1)}" rx="${s * 0.7}" ry="${s * 0.32}" fill="#6cb87a"/>`; }).join('')}</g>`;

      // Faces
      let bld = '';
      bld += poly([P(0, d, 0), P(w, d, 0), P(w, d, H), P(0, d, H)], `fill="url(#lf${uid})"`);   // left face (y = d)
      bld += poly([P(w, 0, 0), P(w, d, 0), P(w, d, H), P(w, 0, H)], `fill="url(#rf${uid})"`);   // right face (x = w)
      // Windows + slabs per floor
      const cols = (len) => Math.max(3, Math.round(len / 0.9));
      for (let f = 1; f <= n; f++) {
        const z0 = zOf(f), h = hOf(f);
        // slab line
        if (f > 1) {
          bld += `<path d="M${pt(P(0, d, z0))}L${pt(P(w, d, z0))}L${pt(P(w, 0, z0))}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/>`;
          bld += `<path d="M${pt(P(0, d + 0.12, z0))}L${pt(P(w + 0.12, d + 0.12, z0))}L${pt(P(w + 0.12, 0, z0))}" fill="none" stroke="rgba(60,70,110,.18)" stroke-width="1"/>`;
        }
        const wz0 = z0 + h * (f === 1 ? 0.14 : 0.2), wz1 = z0 + h * (f === 1 ? 0.8 : 0.86);
        // left face windows (along x)
        const cl = cols(w);
        for (let j = 0; j < cl; j++) {
          const x0 = 0.25 + (j * (w - 0.5)) / cl, x1 = x0 + ((w - 0.5) / cl) * 0.68;
          if (f === 1 && j >= Math.floor(cl * 0.45) && j <= Math.floor(cl * 0.6)) continue; // door gap
          const lit = rnd() < 0.3;
          bld += poly([P(x0, d, wz0), P(x1, d, wz0), P(x1, d, wz1), P(x0, d, wz1)], `fill="${lit ? '#fff3cf' : `url(#gl${uid})`}" opacity="${lit ? 0.95 : 0.9}"`);
        }
        // right face windows (along y)
        const cr = cols(d);
        for (let j = 0; j < cr; j++) {
          const y0 = 0.22 + (j * (d - 0.44)) / cr, y1 = y0 + ((d - 0.44) / cr) * 0.7;
          const lit = rnd() < 0.25;
          bld += poly([P(w, y0, wz0), P(w, y1, wz0), P(w, y1, wz1), P(w, y0, wz1)], `fill="${lit ? '#fff3cf' : `url(#gr${uid})`}" opacity="${lit ? 0.9 : 0.85}"`);
          // louvres
          if (!lit && f > 1) { const m = (wz0 + wz1) / 2; bld += `<path d="M${pt(P(w, y0, m))}L${pt(P(w, y1, m))}" stroke="rgba(255,255,255,.35)" stroke-width="1"/>`; }
        }
      }
      // Door
      const dx0 = w * 0.46, dx1 = w * 0.6;
      bld += poly([P(dx0, d, 0), P(dx1, d, 0), P(dx1, d, gH * 0.75), P(dx0, d, gH * 0.75)], 'fill="#3f4766"');
      bld += poly([P(dx0 - 0.2, d + 0.35, gH * 0.85), P(dx1 + 0.2, d + 0.35, gH * 0.85), P(dx1 + 0.2, d, gH * 0.85), P(dx0 - 0.2, d, gH * 0.85)], 'fill="#fff" opacity=".85"');
      // Vertical fins on the corner
      bld += `<path d="M${pt(P(w, d, 0))}L${pt(P(w, d, H))}" stroke="rgba(255,255,255,.7)" stroke-width="2"/>`;
      // Roof + parapet
      bld += poly([P(0, 0, H), P(w, 0, H), P(w, d, H), P(0, d, H)], `fill="url(#rt${uid})"`);
      const i2 = 0.28;
      bld += poly([P(i2, i2, H), P(w - i2, i2, H), P(w - i2, d - i2, H), P(i2, d - i2, H)], `fill="${shade(T, -0.08)}" opacity=".55"`);
      // rooftop unit
      const ux = w * 0.62, uy = d * 0.25, uw = 1.1, ud = 0.9, uh = 0.55;
      bld += poly([P(ux, uy + ud, H), P(ux + uw, uy + ud, H), P(ux + uw, uy + ud, H + uh), P(ux, uy + ud, H + uh)], `fill="${shade(L, -0.06)}"`);
      bld += poly([P(ux + uw, uy, H), P(ux + uw, uy + ud, H), P(ux + uw, uy + ud, H + uh), P(ux + uw, uy, H + uh)], `fill="${shade(R, -0.1)}"`);
      bld += poly([P(ux, uy, H + uh), P(ux + uw, uy, H + uh), P(ux + uw, uy + ud, H + uh), P(ux, uy + ud, H + uh)], 'fill="#f4f6fb"');

      // Your floor: a glowing band on both faces + a pin
      let hl = '', hits = '', pinAt = null;
      for (let f = 1; f <= n; f++) {
        const z0 = zOf(f), z1 = z0 + hOf(f);
        const band = [P(0, d, z0), P(w, d, z0), P(w, 0, z0), P(w, 0, z1), P(w, d, z1), P(0, d, z1)];
        if (f === p.floor) {
          hl += poly(band, `fill="var(--accent)" opacity=".28" class="glow"`);
          hl += `<path d="M${pt(P(0, d, z0))}L${pt(P(w, d, z0))}L${pt(P(w, 0, z0))}M${pt(P(0, d, z1))}L${pt(P(w, d, z1))}L${pt(P(w, 0, z1))}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>`;
          pinAt = P(w, d * 0.35, (z0 + z1) / 2);
        }
        hits += `<g data-floor="${f}">${poly(band, 'class="floor-hit"')}<g class="floor-hover">${poly(band, 'fill="rgba(255,255,255,.35)" stroke="#fff" stroke-width="1.4"')}</g></g>`;
      }
      let pin = '';
      if (pinAt) {
        const [px, py] = pinAt, lx = px + 46, ly = py - 30;
        pin = `<g class="pin"><g class="float"><path d="M${px.toFixed(1)} ${py.toFixed(1)}L${(lx - 8).toFixed(1)} ${(ly + 8).toFixed(1)}H${lx.toFixed(1)}" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
          <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" fill="var(--accent)" stroke="#fff" stroke-width="2"/>
          <rect x="${lx.toFixed(1)}" y="${(ly - 17).toFixed(1)}" width="104" height="34" rx="10" fill="#fff" stroke="rgba(20,22,28,.08)"/>
          <text class="pin-txt" x="${(lx + 10).toFixed(1)}" y="${(ly - 2).toFixed(1)}">${p.floor}F · Your office</text>
          <text class="pin-sub" x="${(lx + 10).toFixed(1)}" y="${(ly + 11).toFixed(1)}">${p.here?.length || 0} here now</text></g></g>`;
      }

      // Fit the viewBox to everything
      const ext = [P(-g, -g, 0), P(w + g, -g, 0), P(w + g, d + g, -gt), P(-g, d + g, -gt), P(0, 0, H + 3), P(w, 0, H), pinAt ? [pinAt[0] + 152, pinAt[1] - 50] : P(0, 0, 0)];
      const xs = ext.map((e) => e[0]), ys = ext.map((e) => e[1]);
      const minX = Math.min(...xs) - 10, maxX = Math.max(...xs) + 10, minY = Math.min(...ys) - 30, maxY = Math.max(...ys) + 12;
      // Zoom origin = your floor, as a fraction of the viewBox
      const zo = pinAt ? [((pinAt[0] - 20 - minX) / (maxX - minX)) * 100, ((pinAt[1] - minY) / (maxY - minY)) * 100] : [50, 50];

      const defs = `<defs>
        <linearGradient id="lf${uid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${shade(L, 0.12)}"/><stop offset="1" stop-color="${shade(L, -0.06)}"/></linearGradient>
        <linearGradient id="rf${uid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${shade(R, 0.1)}"/><stop offset="1" stop-color="${shade(R, -0.12)}"/></linearGradient>
        <linearGradient id="rt${uid}" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="${shade(L, 0.2)}"/><stop offset="1" stop-color="${T}"/></linearGradient>
        <linearGradient id="gl${uid}" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e9f1ff"/><stop offset=".55" stop-color="${shade(R, -0.15)}"/><stop offset="1" stop-color="${shade(R, -0.32)}"/></linearGradient>
        <linearGradient id="gr${uid}" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#dfe9fb"/><stop offset=".5" stop-color="${shade(R, -0.28)}"/><stop offset="1" stop-color="${shade(R, -0.42)}"/></linearGradient>
        <linearGradient id="pl${uid}" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f6f8fd"/><stop offset="1" stop-color="#dfe6f3"/></linearGradient>
        <radialGradient id="sh${uid}"><stop offset="0" stop-color="rgba(60,80,130,.28)"/><stop offset="1" stop-color="rgba(60,80,130,0)"/></radialGradient>
      </defs>`;
      return {
        svg: `<svg viewBox="${minX.toFixed(0)} ${minY.toFixed(0)} ${(maxX - minX).toFixed(0)} ${(maxY - minY).toFixed(0)}" preserveAspectRatio="xMidYMax meet" role="img" aria-label="${p.name}: ${n}-storey building, your office on floor ${p.floor}">${defs}
          <g class="bld" style="transform-origin:${zo[0].toFixed(1)}% ${zo[1].toFixed(1)}%;transform-box:view-box">${out}${back}${bld}${hl}${hits}${front}</g>${pin}</svg>`,
        n,
      };
    }

    /* ---------- Card ---------- */
    let uidN = 0;
    function mount(el, cfg) {
      const props = cfg.properties.slice();
      let i = 0;
      el.innerHTML = `
        <header class="head">
          <h1>Property</h1>
          <div class="head__r">
            <p class="count" data-count aria-live="polite"></p>
            <button class="arrow" type="button" data-prev aria-label="Previous property">${I.prev}</button>
            <button class="arrow" type="button" data-next aria-label="Next property">${I.next}</button>
          </div>
        </header>
        <div class="stage" data-stage>
          <span class="sun" aria-hidden="true"></span>
          <div data-track></div>
          <div class="dots" data-dots role="tablist" aria-label="Choose a property"></div>
          <div class="toast" data-toast role="status"></div>
        </div>
        <div class="info" data-info aria-live="polite"></div>
        <div class="actions">
          <button class="btn btn--add" type="button" data-add>Add property ${I.layers}</button>
          <button class="btn btn--enter" type="button" data-enter>Enter ${I.enter}</button>
        </div>
        <dialog data-dialog aria-labelledby="addTitle">
          <form class="sheet" method="dialog" data-form>
            <h2 id="addTitle">Add a property</h2>
            <p class="lead">It appears on the turntable with its own building.</p>
            <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" required placeholder="e.g. Kyoto Studio"></div>
            <div class="two">
              <div class="field"><label for="f-postal">Postal code</label><input id="f-postal" name="postal" placeholder="600-8216" inputmode="numeric"></div>
              <div class="field"><label for="f-floor">Your floor</label><input id="f-floor" name="floor" type="number" min="1" max="30" value="3" required></div>
            </div>
            <div class="field"><label for="f-addr">Address</label><input id="f-addr" name="address" required placeholder="Kyoto-fu, Kyoto-shi, Shimogyō-ku"></div>
            <div class="two">
              <div class="field"><label for="f-bld">Building</label><input id="f-bld" name="building" placeholder="Building name"></div>
              <div class="field"><label for="f-floors">Storeys</label><input id="f-floors" name="floors" type="number" min="2" max="30" value="6" required></div>
            </div>
            <div class="sheet__btns"><button class="no" type="button" data-cancel>Cancel</button><button class="ok" value="ok">Add property</button></div>
          </form>
        </dialog>`;
      const q = (s) => el.querySelector(s);
      const track = q('[data-track]');

      function slides() {
        track.innerHTML = props.map((p, k) => `<div class="slide" data-k="${k}">${building(p, `${++uidN}`).svg}</div>`).join('');
        q('[data-dots]').innerHTML = props.map((p, k) => `<button type="button" role="tab" data-go="${k}" aria-label="${p.name}"></button>`).join('');
        place();
      }
      function place() {
        const N = props.length;
        track.querySelectorAll('.slide').forEach((s) => {
          const k = +s.dataset.k;
          let o = k - i;
          if (o > N / 2) o -= N; if (o < -N / 2) o += N;      // wrap so neighbours sit either side
          s.style.setProperty('--o', o); s.style.setProperty('--a', Math.min(Math.abs(o), 2));
          s.hidden = Math.abs(o) > 1;
          s.classList.toggle('is-current', o === 0);
          s.setAttribute('aria-hidden', String(o !== 0));
        });
        q('[data-dots]').querySelectorAll('[data-go]').forEach((b) => { const on = +b.dataset.go === i; b.setAttribute('aria-current', String(on)); b.setAttribute('aria-selected', String(on)); });
        q('[data-count]').innerHTML = `<b>${String(i + 1).padStart(2, '0')}</b> / ${String(N).padStart(2, '0')}`;
        info();
      }
      function info() {
        const p = props[i];
        const here = p.here || [];
        q('[data-info]').innerHTML = `
          <div class="info__top"><h2 class="name rv">${p.name}</h2><span class="floorbadge rv" style="--d:1"><i aria-hidden="true"></i>${p.floor}F</span></div>
          <div class="addr rv" style="--d:2">
            <p>${p.postal ? `〒${p.postal} · ` : ''}${p.address}${p.building ? `<br>${p.building}` : ''}${p.addressJa ? `<small lang="ja">${p.addressJa}</small>` : ''}</p>
            <div class="tools">
              <button class="tool" type="button" data-copy aria-label="Copy address">${I.copy}</button>
              <a class="tool" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([p.postal, p.addressJa || p.address, p.building].filter(Boolean).join(' '))}" target="_blank" rel="noopener" aria-label="Open in Maps">${I.map}</a>
            </div>
          </div>
          <div class="meta rv" style="--d:3">
            <span>${I.floors}<b>${p.floors}</b> floors</span>
            <span>${I.seats}<b>${p.seats ?? '—'}</b> seats</span>
            <span>${here.length ? `<span class="faces" aria-hidden="true">${here.slice(0, 4).map((h, k) => `<i style="--c:${FACE[(hash(h) + k) % FACE.length]}">${h}</i>`).join('')}</span>` : ''}<span class="live" aria-hidden="true"></span><b>${here.length}</b> here now</span>
          </div>`;
        el.setAttribute('aria-label', `Property ${i + 1} of ${props.length}: ${p.name}, floor ${p.floor}`);
      }
      function go(k) { const N = props.length; k = (k + N) % N; if (k === i) return; i = k; place(); }

      /* events */
      q('[data-prev]').addEventListener('click', () => go(i - 1));
      q('[data-next]').addEventListener('click', () => go(i + 1));
      q('[data-dots]').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go); });
      track.addEventListener('click', (e) => { const s = e.target.closest('.slide'); if (s && !s.classList.contains('is-current')) go(+s.dataset.k); });
      el.addEventListener('keydown', (e) => {
        if (e.target.closest('dialog, input')) return;
        if (e.key === 'ArrowRight') go(i + 1);
        if (e.key === 'ArrowLeft') go(i - 1);
      });
      // Floor hover readout
      track.addEventListener('pointerover', (e) => {
        const f = e.target.closest('[data-floor]'); if (!f || !f.closest('.is-current')) return;
        const n = +f.dataset.floor, p = props[i];
        f.querySelector('.floor-hover').classList.add('is-on');
        f.addEventListener('pointerleave', () => f.querySelector('.floor-hover').classList.remove('is-on'), { once: true });
        f.querySelector('title')?.remove();
        f.insertAdjacentHTML('afterbegin', `<title>${n}F${n === p.floor ? ' · Your office' : n === 1 ? ' · Lobby' : ''}</title>`);
      });
      // Swipe
      let sx = null;
      const stage = q('[data-stage]');
      stage.addEventListener('pointerdown', (e) => { sx = e.clientX; });
      stage.addEventListener('pointerup', (e) => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); });
      // Copy address
      el.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-copy]'); if (!b) return;
        const p = props[i];
        const txt = [p.postal && `〒${p.postal}`, p.addressJa || p.address, p.building].filter(Boolean).join(' ');
        try { await navigator.clipboard.writeText(txt); b.dataset.done = 'Copied'; } catch { b.dataset.done = 'Copy failed'; }
        setTimeout(() => delete b.dataset.done, 1400);
      });
      // Enter: zoom into your floor
      let entering = false;
      q('[data-enter]').addEventListener('click', () => {
        if (entering) return;
        entering = true;
        const p = props[i], toast = q('[data-toast]');
        const done = () => { cfg.onEnter?.(p); };
        if (reduce.matches) { toast.innerHTML = `Entering ${p.name}<small>${p.floor}F</small>`; toast.classList.add('is-on'); setTimeout(() => { toast.classList.remove('is-on'); entering = false; done(); }, 1200); return; }
        el.classList.add('is-entering');
        setTimeout(() => { toast.innerHTML = `Entering ${p.name}<small>${p.floor}F · ${p.here?.length || 0} people here</small>`; toast.classList.add('is-on'); }, 700);
        setTimeout(() => { done(); toast.classList.remove('is-on'); el.classList.remove('is-entering'); entering = false; }, 2300);
      });
      // Add property
      const dlg = q('[data-dialog]'), form = q('[data-form]');
      q('[data-add]').addEventListener('click', () => { form.reset(); dlg.showModal(); q('#f-name').focus(); });
      q('[data-cancel]').addEventListener('click', () => dlg.close());
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const f = new FormData(form);
        const floors = clamp(+f.get('floors') || 6, 2, 30);
        const palettes = [['#f3c7dc', '#8e9cd8', '#a9dfe0'], ['#fde2c4', '#9fb5e8', '#cfe9d9'], ['#d9e7ff', '#8fa6d9', '#ffd9c7'], ['#e5dcff', '#9a8fd8', '#bde7f0'], ['#d4f1e4', '#7fb3c9', '#ffe6b0']];
        const p = {
          id: `p${Date.now()}`, name: f.get('name').trim(), postal: f.get('postal').trim(), address: f.get('address').trim(), building: f.get('building').trim(),
          floors, floor: clamp(+f.get('floor') || 1, 1, floors), seats: null, here: [],
          palette: palettes[props.length % palettes.length],
        };
        dlg.close();
        add(p);
        cfg.onAdd?.(p);
      });
      function add(p) { props.push(p); i = props.length - 1; slides(); }

      slides();
      return { go, add };
    }
    return { mount };
  })();

  /* ---------- Demo ---------- */
  PropertyCard.mount(document.querySelector('[data-prop]'), {
    properties: [
      { id: 'nagoya', name: 'Nagoya Test Office', postal: '460-0003', address: 'Aichi-ken, Nagoya-shi, Naka-ku', addressJa: '愛知県名古屋市中区', building: 'Takisada Building 7F',
        floors: 9, floor: 7, seats: 40, here: ['AK', 'MS', 'YT', 'RN', 'HI'], palette: ['#f3c7dc', '#8e9cd8', '#a9dfe0'] },
      { id: 'shibuya', name: 'Shibuya HQ', postal: '150-0002', address: 'Tokyo-to, Shibuya-ku, Shibuya', addressJa: '東京都渋谷区渋谷', building: 'Miyamasu Square 11F',
        floors: 14, floor: 11, seats: 120, here: ['KO', 'EN', 'SA', 'JM', 'TK', 'LU', 'AY', 'MR'], palette: ['#fde2c4', '#9fb5e8', '#cfe9d9'] },
      { id: 'umeda', name: 'Osaka Studio', postal: '530-0001', address: 'Osaka-fu, Osaka-shi, Kita-ku, Umeda', addressJa: '大阪府大阪市北区梅田', building: 'Kitano Terrace 3F',
        floors: 6, floor: 3, seats: 24, here: ['RI', 'DS'], palette: ['#e5dcff', '#9a8fd8', '#bde7f0'] },
      { id: 'hakata', name: 'Fukuoka Hub', postal: '812-0011', address: 'Fukuoka-ken, Fukuoka-shi, Hakata-ku', addressJa: '福岡県福岡市博多区博多駅前', building: 'Ekimae Annex 5F',
        floors: 8, floor: 5, seats: 32, here: [], palette: ['#d4f1e4', '#7fb3c9', '#ffe6b0'] },
    ],
    onEnter: (p) => console.log('enter', p.id),
    onAdd: (p) => console.log('added', p),
  });
  </script>
</body>
