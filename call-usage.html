<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Call usage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================
       Call usage — daily stacked columns: one-on-one vs room minutes for a month
       ========================================================= */
    :root {
      --bg-a: #f5fbfd;
      --bg-b: #eef4fa;
      --card: #ffffff;
      --ink: #0f1115;
      --text: #3b4250;
      --dim: #6b7383;
      --faint: #9aa1ae;
      --line: #e6eaf0;
      --line-2: #d5dbe4;
      --one: #2f6fe4;           /* one-on-one */
      --room: #e39a2d;          /* room calls */
      --weekend: #f6f8fb;
      --sans: 'Noto Sans', system-ui, sans-serif;
      --mono: 'Noto Sans Mono', ui-monospace, monospace;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg-b); }
    body {
      min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: start;
      padding: 40px 16px; background: linear-gradient(180deg, var(--bg-a), var(--bg-b)); color: var(--ink); font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .sr-only { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    table.sr-only { display: block; }

    .usage { position: relative; width: min(100%, 900px); }
    .head { display: flex; align-items: center; gap: 18px; }
    .head__ico { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 14px; background: var(--card); box-shadow: 0 1px 2px rgba(15, 17, 21, .04); }
    .head__ico svg { width: 30px; height: 30px; }
    .head h1 { font-size: 30px; font-weight: 600; letter-spacing: -.01em; }

    .pager { display: flex; align-items: center; gap: 8px; margin: 26px 0 22px; }
    .pager__btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--card); box-shadow: 0 0 0 1px var(--line-2) inset; transition: background-color .2s, opacity .2s; }
    .pager__btn:hover:not(:disabled) { background: #f2f5f9; }
    .pager__btn:disabled { opacity: .35; cursor: default; }
    .pager__btn:focus-visible { outline: 2px solid var(--one); outline-offset: 2px; }
    .pager__btn svg { width: 18px; height: 18px; }
    .pager__m { min-width: 200px; text-align: center; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }

    .card { background: var(--card); border-radius: 18px; box-shadow: 0 1px 2px rgba(15, 17, 21, .04); }
    .main { padding: 26px 30px 22px; }

    /* Totals + split */
    .totals { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 28px; }
    .lbl { color: var(--text); font-size: 14px; }
    .big { margin-top: 4px; font-size: 40px; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
    .big small { margin-left: 6px; font-size: 18px; font-weight: 500; color: var(--dim); }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; }
    .lg { display: grid; justify-items: start; text-align: left; grid-template-columns: 10px auto; column-gap: 8px; align-items: center; border-radius: 10px; padding: 4px 8px; margin: -4px -8px; transition: opacity .25s, background-color .2s; }
    .lg:hover, .lg:focus-visible { background: #f4f7fb; }
    .lg:focus-visible { outline: 2px solid var(--one); outline-offset: 1px; }
    .lg i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
    .lg span { font-size: 13px; color: var(--text); }
    .lg b { grid-column: 2; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .lg b small { margin-left: 4px; font-size: 12px; font-weight: 500; color: var(--dim); }
    .lg em { grid-column: 2; font-style: normal; font-size: 12px; color: var(--dim); }
    .usage.is-only .lg:not(.is-hot) { opacity: .4; }

    .split { display: flex; gap: 3px; height: 10px; margin-top: 18px; border-radius: 6px; overflow: hidden; background: var(--line); }
    .split i { flex: 0 0 auto; width: var(--w); background: var(--c); transition: width .7s var(--ease); }

    /* Chart */
    .chart { position: relative; height: 260px; margin-top: 26px; }
    .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .chart:focus-visible { outline: 2px solid var(--one); outline-offset: 6px; border-radius: 8px; }
    .grid line { stroke: var(--line); }
    .ylab, .xlab { fill: var(--faint); font: 400 11px var(--mono); font-variant-numeric: tabular-nums; }
    .xlab.is-today { fill: var(--ink); font-weight: 500; }
    .wk { fill: var(--weekend); }
    .base { stroke: var(--line-2); }
    .col { transform-box: fill-box; transform-origin: bottom; transition: opacity .2s; }
    .col.is-grow { animation: grow .7s var(--ease) both; animation-delay: var(--d); }
    @keyframes grow { from { transform: scaleY(0); } }
    .usage.is-hover .col:not(.is-hot) { opacity: .35; }
    .usage.is-only .seg-p:not(.is-on) { opacity: .15; }
    .seg-p { transition: opacity .25s; }
    .hot-band { fill: rgba(47, 111, 228, .06); opacity: 0; }
    .usage.is-hover .hot-band { opacity: 1; }
    .future { fill: none; stroke: var(--line-2); stroke-dasharray: 2 3; }
    .tip {
      position: absolute; top: 0; left: 0; z-index: 2; min-width: 168px; padding: 10px 12px; border-radius: 12px;
      background: var(--ink); color: #fff; font-size: 12px; line-height: 1.5; pointer-events: none;
      opacity: 0; transition: opacity .15s; box-shadow: 0 10px 30px -10px rgba(15, 17, 21, .5);
    }
    .usage.is-hover .tip { opacity: 1; }
    .tip b { display: block; margin-bottom: 4px; font-weight: 600; }
    .tip p { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
    .tip p span { display: inline-flex; align-items: center; gap: 6px; color: #c9ceda; }
    .tip p span i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
    .tip hr { border: 0; border-top: 1px solid rgba(255, 255, 255, .14); margin: 6px 0; }
    .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 14px; }

    /* Stats row */
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 18px; border-top: 1px solid var(--line); }
    .stat { padding: 16px 0 0 18px; border-left: 1px solid var(--line); }
    .stat:first-child { padding-left: 0; border-left: 0; }
    .stat dt { color: var(--text); font-size: 13px; }
    .stat dd { margin-top: 4px; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat dd small { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--dim); }

    .foot { margin-top: 14px; color: var(--dim); font-size: 12.5px; line-height: 1.5; }
    .note { width: min(100%, 900px); margin-top: 14px; color: var(--faint); font-size: 12px; }
    .note code { font-family: var(--mono); font-size: 11px; }

    @media (max-width: 640px) {
      .head h1 { font-size: 24px; }
      .head__ico { width: 46px; height: 46px; }
      .pager__m { min-width: 0; flex: 1; font-size: 17px; }
      .main { padding: 20px 18px 18px; }
      .big { font-size: 32px; }
      .chart { height: 220px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat { padding: 14px 0 0 14px; }
      .stat:nth-child(3) { padding-left: 0; border-left: 0; }
      .stat dd { font-size: 19px; }
    }
    @media (prefers-reduced-motion: reduce) { .col.is-grow { animation: none; } .split i, .tip, .lg { transition: none; } }
  </style>
</head>
<body>

  <section class="usage" data-usage aria-label="Call usage"></section>
  <p class="note">Sample calls, generated for the demo; October matches the screenshot totals. Pass your own records to <code>CallUsage.mount()</code>.</p>

  <script>
  /* =============================================================
     CallUsage — monthly call minutes as daily stacked columns.
     CallUsage.mount(el, {
       calls: [{ date: Date, kind: 'one' | 'room', minutes: n }],   // person-minutes per call
       rate: 0.002,                                                  // $ per person-minute
       month: { y: 2026, m: 9 },                                     // 0-based month to open on
     })  →  { update(calls) }
     ============================================================= */
  window.CallUsage = (() => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const KINDS = [
      { id: 'one', name: 'One-on-one', limit: 'Never limited', c: 'var(--one)' },
      { id: 'room', name: 'Room calls', limit: 'No monthly limit', c: 'var(--room)' },
    ];
    const MONTH = (y, m) => new Date(y, m, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const mins = (v) => (v === 0 ? '0' : v < 10 ? v.toFixed(1) : (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, ''));
    const money = (v) => `$${v.toFixed(4)}`;
    const dayLong = (d) => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const ICO = '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M27 18.5A11 11 0 1 1 13.5 5"/><path d="M17 3.5a11 11 0 0 1 11.5 11.5H17Z"/></svg>';
    const ARR = (d) => `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;

    function mount(el, cfg) {
      const rate = cfg.rate ?? 0.002;
      let calls = cfg.calls;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const span = () => {
        const ds = calls.map((c) => c.date);
        const first = ds.length ? new Date(Math.min(...ds)) : today;
        return { min: { y: first.getFullYear(), m: first.getMonth() }, max: { y: today.getFullYear(), m: today.getMonth() } };
      };
      let cur = cfg.month || span().max;
      let hot = -1, only = null;

      el.innerHTML = `
        <header class="head"><span class="head__ico">${ICO}</span><h1>Call usage</h1></header>
        <nav class="pager" aria-label="Month">
          <button class="pager__btn" type="button" data-step="-1" aria-label="Previous month">${ARR('M12.5 4.5 7 10l5.5 5.5')}</button>
          <p class="pager__m" data-month aria-live="polite"></p>
          <button class="pager__btn" type="button" data-step="1" aria-label="Next month">${ARR('M7.5 4.5 13 10l-5.5 5.5')}</button>
        </nav>
        <div class="card main">
          <div class="totals">
            <div><p class="lbl">Call minutes</p><p class="big" data-big></p></div>
            <div class="legend" data-legend></div>
          </div>
          <div class="split" data-split aria-hidden="true"></div>
          <div class="chart" data-chart tabindex="0" role="slider" aria-label="Day of the month">
            <svg data-svg aria-hidden="true"></svg>
            <div class="tip" data-tip aria-hidden="true"></div>
          </div>
          <dl class="stats" data-stats></dl>
          <p class="foot">Cost at RealtimeKit’s price ($${rate} per person-minute). Free during the beta.</p>
        </div>
        <table class="sr-only" data-table></table>`;
      const q = (s) => el.querySelector(s);
      let M = null, G = null;

      function month() {
        const n = new Date(cur.y, cur.m + 1, 0).getDate();
        const days = Array.from({ length: n }, (_, i) => ({ date: new Date(cur.y, cur.m, i + 1), one: 0, room: 0, calls: 0 }));
        calls.forEach((c) => {
          if (c.date.getFullYear() !== cur.y || c.date.getMonth() !== cur.m) return;
          const d = days[c.date.getDate() - 1];
          d[c.kind] += c.minutes; d.calls++;
        });
        const one = days.reduce((a, d) => a + d.one, 0), room = days.reduce((a, d) => a + d.room, 0);
        const count = days.reduce((a, d) => a + d.calls, 0);
        const busiest = days.reduce((b, d, i) => (d.one + d.room > days[b].one + days[b].room ? i : b), 0);
        return { days, one, room, total: one + room, count, busiest };
      }

      function text() {
        const s = span();
        q('[data-month]').textContent = MONTH(cur.y, cur.m);
        q('[data-step="-1"]').disabled = cur.y * 12 + cur.m <= s.min.y * 12 + s.min.m;
        q('[data-step="1"]').disabled = cur.y * 12 + cur.m >= s.max.y * 12 + s.max.m;
        q('[data-big]').innerHTML = `${mins(M.total)}<small>min</small>`;
        q('[data-legend]').innerHTML = KINDS.map((k) => `
          <button class="lg${only === k.id ? ' is-hot' : ''}" type="button" data-k="${k.id}" style="--c:${k.c}" aria-pressed="${only === k.id}">
            <i aria-hidden="true"></i><span>${k.name}</span><b>${mins(M[k.id])}<small>min · ${M.total ? Math.round(M[k.id] / M.total * 100) : 0}%</small></b><em>${k.limit}</em>
          </button>`).join('');
        q('[data-split]').innerHTML = M.total ? KINDS.map((k) => `<i style="--c:${k.c};--w:calc(${(M[k.id] / M.total * 100).toFixed(2)}% - 1.5px)"></i>`).join('') : '';
        const b = M.days[M.busiest], bt = b.one + b.room;
        q('[data-stats]').innerHTML = [
          ['Calls', String(M.count), M.count ? `${(M.count / M.days.filter((d) => d.calls).length).toFixed(1)} on a call day` : 'No calls'],
          ['Average call', M.count ? `${mins(M.total / M.count)} min` : '—', 'across both kinds'],
          ['Busiest day', bt ? b.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—', bt ? `${mins(bt)} min` : 'No calls'],
          ['Cost', money(M.total * rate), 'Free during the beta'],
        ].map(([k, v, s]) => `<div class="stat"><dt>${k}</dt><dd>${v}<small>${s}</small></dd></div>`).join('');
        q('[data-table]').innerHTML = `<caption>Call minutes per day, ${MONTH(cur.y, cur.m)}</caption><thead><tr><th>Day</th><th>One-on-one</th><th>Room calls</th><th>Calls</th><th>Cost</th></tr></thead><tbody>${
          M.days.filter((d) => d.calls).map((d) => `<tr><td>${dayLong(d.date)}</td><td>${mins(d.one)}</td><td>${mins(d.room)}</td><td>${d.calls}</td><td>${money((d.one + d.room) * rate)}</td></tr>`).join('')}</tbody>`;
        el.setAttribute('aria-label', `Call usage, ${MONTH(cur.y, cur.m)}: ${mins(M.total)} minutes over ${M.count} calls; one-on-one ${mins(M.one)}, room calls ${mins(M.room)}; cost ${money(M.total * rate)}`);
      }

      function draw(animate) {
        const box = q('[data-chart]'), W = box.clientWidth, H = box.clientHeight;
        if (!W) return;
        const padL = 34, padR = 4, top = 22, bot = H - 24;
        const n = M.days.length, slot = (W - padL - padR) / n, bw = Math.max(4, Math.min(18, slot * 0.62));
        const hi = Math.max(...M.days.map((d) => d.one + d.room), 1);
        const step = [1, 2, 5, 10, 15, 20, 30, 60, 120].find((v) => hi / v <= 4) || 240;
        const max = Math.ceil(hi / step) * step;
        const y = (v) => bot - (v / max) * (bot - top);
        const cx = (i) => padL + slot * (i + 0.5);
        const ticks = []; for (let v = 0; v <= max; v += step) ticks.push(v);
        const weekends = M.days.map((d, i) => (d.date.getDay() % 6 === 0 ? `<rect class="wk" x="${(cx(i) - slot / 2).toFixed(1)}" y="${top}" width="${slot.toFixed(1)}" height="${bot - top}"/>` : '')).join('');
        const tIdx = M.days.findIndex((d) => +d.date === +today);
        const cols = M.days.map((d, i) => {
          const x = cx(i) - bw / 2;
          if (+d.date > +today) return `<line class="future" x1="${cx(i)}" x2="${cx(i)}" y1="${bot - 6}" y2="${bot}"/>`;
          if (!d.calls) return '';
          let acc = 0, segs = '';
          KINDS.forEach((k) => {
            const v = d[k.id]; if (!v) return;
            const y1 = y(acc + v), y0 = y(acc); acc += v;
            const h = Math.max(1.5, y0 - y1 - (segs ? 1.5 : 0));
            segs += `<rect class="seg-p${only === k.id ? ' is-on' : ''}" x="${x.toFixed(1)}" y="${(y0 - h - (segs ? 1.5 : 0)).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(3, bw / 4)}" fill="${k.c}"/>`;
          });
          return `<g class="col${animate && !reduce.matches ? ' is-grow' : ''}${i === hot ? ' is-hot' : ''}" style="--d:${i * 18}ms">${segs}</g>`;
        }).join('');
        const every = n > 0 && W < 520 ? 7 : 5;
        const xl = M.days.map((d, i) => (i === 0 || (i + 1) % every === 0 || i === tIdx ? `<text class="xlab${i === tIdx ? ' is-today' : ''}" x="${cx(i)}" y="${H - 6}" text-anchor="middle">${i === tIdx ? 'Today' : d.date.getDate()}</text>` : '')).join('');
        q('[data-svg]').innerHTML = `
          ${weekends}
          <g class="grid">${ticks.slice(1).map((v) => `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/>`).join('')}</g>
          ${ticks.map((v) => `<text class="ylab" x="${padL - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('')}
          <text class="ylab" x="0" y="8">min</text>
          <rect class="hot-band" data-band x="0" y="${top}" width="${slot}" height="${bot - top}"/>
          <line class="base" x1="${padL}" x2="${W - padR}" y1="${bot}" y2="${bot}"/>
          ${cols}${xl}`;
        q('.empty')?.remove();
        if (!M.count) box.insertAdjacentHTML('beforeend', '<p class="empty">No calls this month</p>');
        G = { cx, slot, padL, W, n };
        if (hot >= 0) setHot(hot, true);
      }

      function setHot(i, force) {
        if (i === hot && !force) return;
        hot = i;
        el.classList.toggle('is-hover', i >= 0);
        const box = q('[data-chart]');
        box.setAttribute('aria-valuemin', 1); box.setAttribute('aria-valuemax', M.days.length);
        el.querySelectorAll('.col').forEach((g) => g.classList.remove('is-hot'));
        if (i < 0) { box.setAttribute('aria-valuetext', 'Use the arrow keys to read each day'); return; }
        const d = M.days[i], t = d.one + d.room;
        const cols = [...el.querySelectorAll('.col')];
        // find the column group for this day by its x position
        const x = G.cx(i);
        cols.forEach((g) => { const r = g.querySelector('rect'); if (r && Math.abs(+r.getAttribute('x') + +r.getAttribute('width') / 2 - x) < 1) g.classList.add('is-hot'); });
        const band = q('[data-band]'); band.setAttribute('x', (x - G.slot / 2).toFixed(1)); band.setAttribute('width', G.slot.toFixed(1));
        const tip = q('[data-tip]');
        tip.innerHTML = `<b>${dayLong(d.date)}</b>${+d.date > +today ? '<p><span>Still to come</span></p>' : `
          ${KINDS.map((k) => `<p><span style="--c:${k.c}"><i></i>${k.name}</span>${mins(d[k.id])} min</p>`).join('')}<hr>
          <p><span>Calls</span>${d.calls}</p><p><span>Cost</span>${money(t * rate)}</p>`}`;
        const w = tip.offsetWidth;
        const side = x + 16 + w <= G.W ? x + 16 : x - 16 - w;
        tip.style.transform = `translate(${clamp(side, 0, G.W - w).toFixed(0)}px, 18px)`;
        box.setAttribute('aria-valuenow', i + 1);
        box.setAttribute('aria-valuetext', `${dayLong(d.date)}: ${mins(t)} minutes, ${d.calls} calls`);
      }

      function render(animate) { M = month(); hot = -1; el.classList.remove('is-hover'); text(); draw(animate); }

      const chart = q('[data-chart]');
      const at = (e) => { const r = chart.getBoundingClientRect(); return clamp(Math.floor((e.clientX - r.left - G.padL) / G.slot), 0, G.n - 1); };
      chart.addEventListener('pointermove', (e) => G && setHot(at(e)));
      chart.addEventListener('pointerdown', (e) => G && setHot(at(e)));
      chart.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') setHot(-1); });
      chart.addEventListener('keydown', (e) => {
        const st = { ArrowLeft: -1, ArrowRight: 1, Home: -99, End: 99 }[e.key];
        if (st) { e.preventDefault(); setHot(clamp((hot < 0 ? M.busiest : hot + st), 0, M.days.length - 1)); }
        else if (e.key === 'Escape') setHot(-1);
      });
      chart.addEventListener('blur', () => setHot(-1));
      el.querySelector('.pager').addEventListener('click', (e) => {
        const b = e.target.closest('[data-step]'); if (!b || b.disabled) return;
        const t = new Date(cur.y, cur.m + +b.dataset.step, 1); cur = { y: t.getFullYear(), m: t.getMonth() };
        render(true);
      });
      addEventListener('keydown', (e) => {
        if (e.target.closest('input, textarea, [role="slider"]')) return;
        if (e.key === 'ArrowLeft' && e.altKey) q('[data-step="-1"]').click();
        if (e.key === 'ArrowRight' && e.altKey) q('[data-step="1"]').click();
      });
      q('[data-legend]').addEventListener('click', (e) => {
        const b = e.target.closest('[data-k]'); if (!b) return;
        only = only === b.dataset.k ? null : b.dataset.k;
        el.classList.toggle('is-only', !!only);
        text(); draw(false);
      });
      new ResizeObserver(() => M && draw(false)).observe(chart);
      render(true);
      return { update(c) { calls = c; render(false); } };
    }
    return { mount };
  })();

  /* ---------- Demo: sample calls; October 2026 matches the screenshot (17 + 82 min, 27 calls, $0.1992) ---------- */
  (() => {
    let s = 20261005;
    const rnd = () => ((s = (s * 16807) % 2147483647), (s - 1) / 2147483646);
    const weekdays = (y, m, until) => {
      const out = [], n = new Date(y, m + 1, 0).getDate();
      for (let d = 1; d <= n; d++) { const t = new Date(y, m, d); if (t.getDay() % 6 && (!until || t <= until)) out.push(t); }
      return out;
    };
    // n calls of one kind on random weekdays, scaled so they sum to `total` person-minutes.
    function make(y, m, kind, n, total, until) {
      const pool = weekdays(y, m, until); if (!pool.length) return [];
      const w = Array.from({ length: n }, () => 0.4 + rnd() * rnd() * 3);
      const sum = w.reduce((a, b) => a + b, 0);
      const out = w.map((v) => ({ date: pool[Math.floor(rnd() * pool.length)], kind, minutes: Math.round((v / sum) * total * 10) / 10 }));
      out[out.length - 1].minutes = Math.round((total - out.slice(0, -1).reduce((a, c) => a + c.minutes, 0)) * 10) / 10;
      return out;
    }
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const calls = [
      ...make(2026, 7, 'one', 19, 64.5), ...make(2026, 7, 'room', 3, 12.4),
      ...make(2026, 8, 'one', 22, 71.8), ...make(2026, 8, 'room', 5, 21.6),
      ...make(2026, 9, 'one', 23, 82.3), ...make(2026, 9, 'room', 4, 17.3),
      ...make(2026, 10, 'one', 4, 14.2, today), ...make(2026, 10, 'room', 1, 3.6, today),
    ].filter((c) => c.date <= today);
    CallUsage.mount(document.querySelector('[data-usage]'), { calls, rate: 0.002, month: { y: 2026, m: 9 } });
  })();
  </script>
