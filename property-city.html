<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property city</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================
       Property city — every office on one block at dusk; the camera flies to the one you pick
       ========================================================= */
    :root {
      --ink: #f2f0ff;
      --dim: #a9acd0;
      --faint: #6f739c;
      --glass: rgba(20, 23, 48, .62);
      --line: rgba(242, 240, 255, .12);
      --accent: #ff8a3d;
      --cream: #fdebd3;
      --live: #3ddc97;
      --sans: 'Manrope', system-ui, sans-serif;
      --jp: 'Noto Sans JP', sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --io: cubic-bezier(.65, 0, .35, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #0c0e1f; }
    body { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: center; gap: 14px; padding: 36px 16px; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased;
      background: radial-gradient(900px 500px at 50% 0%, #1c2150, #0c0e1f 70%); }
    button, input, a { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .note { width: min(100%, 960px); color: var(--faint); font-size: 12px; line-height: 1.5; }
    .note code { font-size: 11px; }

    .city { position: relative; width: min(100%, 960px); border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 40px 80px -30px rgba(0, 0, 0, .7);
      background: linear-gradient(180deg, #121636 0%, #252b5e 42%, #6b4f7d 66%, #e2917a 100%); }

    .top { position: absolute; z-index: 5; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 24px; pointer-events: none; }
    .top > * { pointer-events: auto; }
    .top h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
    .top h1 span { display: block; margin-top: 2px; color: var(--dim); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
    .view { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(12, 14, 31, .5); backdrop-filter: blur(8px); box-shadow: 0 0 0 1px var(--line) inset; }
    .view button { padding: 7px 13px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--dim); transition: background-color .2s, color .2s; }
    .view button[aria-pressed="true"] { background: var(--ink); color: #14183a; }

    .stage { position: relative; height: 560px; touch-action: none; cursor: grab; }
    .stage:active { cursor: grabbing; }
    .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .stars circle { fill: #fff; }
    .twinkle { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 50% { opacity: .2; } }
    .cam { transform-box: view-box; transform-origin: 0 0; transition: transform 1.3s var(--io); }
    .city.is-dragging .cam { transition: none; }
    .lot { transition: opacity .6s, filter .6s; }
    .lot.is-prop { cursor: pointer; }
    .city.has-pick .lot.is-prop:not(.is-picked) { opacity: .78; }
    .lot.is-filler { opacity: .72; }
    .lot .your-floor { opacity: 0; transition: opacity .5s; }
    .lot.is-picked .your-floor { opacity: 1; }
    .glow { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .5; } }
    .floor-hit { fill: transparent; }
    .floor-hover { opacity: 0; transition: opacity .15s; pointer-events: none; }
    .lot.is-picked [data-floor]:hover .floor-hover { opacity: .7; }
    .tag { pointer-events: none; transition: opacity .4s; }
    .tag rect { fill: rgba(14, 16, 36, .82); stroke: rgba(255,255,255,.14); }
    .tag text { fill: var(--ink); font: 600 11px var(--sans); }
    .tag .tag-sub { fill: var(--dim); font: 500 9.5px var(--sans); }
    .tag .tag-dot { fill: var(--accent); }
    .lot-over.is-picked .tag { opacity: 0; }
    .lot-over { pointer-events: none; }
    .pin { opacity: 0; transition: opacity .4s .5s; pointer-events: none; }
    .lot-over.is-picked .pin { opacity: 1; }
    .pin rect { fill: #fff; }
    .pin text { fill: #14183a; font: 700 11px var(--sans); }
    .pin .pin-sub { fill: #6a6f95; font: 500 9px var(--sans); }
    .road-line { stroke: rgba(255, 226, 166, .35); stroke-dasharray: 6 8; stroke-width: 1.4; fill: none; }
    .car { fill: #ffe2a6; }

    /* Info panel */
    .panel { position: absolute; z-index: 6; right: 20px; bottom: 20px; width: 340px; padding: 18px 18px 16px; border-radius: 22px; background: var(--glass); backdrop-filter: blur(18px) saturate(1.2); box-shadow: 0 0 0 1px var(--line) inset, 0 20px 40px -20px rgba(0,0,0,.6); }
    .p-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .p-kick { color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    .p-name { margin-top: 4px; font-size: 22px; font-weight: 700; letter-spacing: -.015em; line-height: 1.15; }
    .badge { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 999px; background: var(--accent); color: #1a1430; font-size: 12px; font-weight: 700; }
    .badge i { width: 7px; height: 7px; border-radius: 50%; background: #fff; }
    .p-addr { margin-top: 10px; color: #d6d7ee; font-size: 13.5px; line-height: 1.5; }
    .p-addr small { display: block; color: var(--dim); font: 400 12px/1.5 var(--jp); }
    .p-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 14px; border-top: 1px solid var(--line); }
    .p-stats div { padding: 12px 0 0; }
    .p-stats div + div { padding-left: 12px; border-left: 1px solid var(--line); }
    .p-stats dt { color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .p-stats dd { margin-top: 4px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
    .live { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: live 2s infinite; }
    @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(61,220,151,.5); } 70%, 100% { box-shadow: 0 0 0 7px rgba(61,220,151,0); } }
    .p-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 999px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; transition: transform .25s var(--ease), background-color .2s; }
    .btn svg { width: 18px; height: 18px; }
    .btn:hover { transform: translateY(-2px); }
    .btn--add { background: var(--cream); color: #1a1430; }
    .btn--enter { background: var(--ink); color: #14183a; }
    .rv { animation: up .6s var(--ease) both; animation-delay: calc(var(--d, 0) * 50ms); }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } }

    /* Picker strip */
    .picks { position: absolute; z-index: 6; left: 20px; bottom: 20px; display: grid; gap: 6px; }
    .pick { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 14px; background: rgba(12, 14, 31, .45); backdrop-filter: blur(8px); box-shadow: 0 0 0 1px var(--line) inset; text-align: left; transition: background-color .2s, transform .25s var(--ease); }
    .pick:hover { transform: translateX(3px); }
    .pick[aria-current="true"] { background: rgba(242, 240, 255, .16); }
    .pick b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,.08); font-size: 11px; font-weight: 700; }
    .pick[aria-current="true"] b { background: var(--accent); color: #1a1430; }
    .pick span { font-size: 13px; font-weight: 600; }
    .pick small { display: block; color: var(--dim); font-size: 11px; font-weight: 500; }

    .toast { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(12, 14, 31, 0); color: #fff; pointer-events: none; transition: background-color .6s; }
    .toast p { opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .5s var(--ease); text-align: center; font-size: 18px; font-weight: 600; }
    .toast small { display: block; color: var(--dim); font-size: 13px; font-weight: 500; }
    .city.is-entering .toast { background: rgba(12, 14, 31, .85); transition-delay: .6s; }
    .city.is-entering .toast p { opacity: 1; transform: none; transition-delay: 1s; }

    dialog { width: min(92vw, 420px); margin: auto; padding: 0; border: 0; border-radius: 24px; background: #161a3a; color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 40px 80px -30px rgba(0,0,0,.8); }
    dialog::backdrop { background: rgba(5, 6, 15, .5); backdrop-filter: blur(4px); }
    .sheet { padding: 22px; }
    .sheet h2 { font-size: 18px; }
    .sheet .lead { margin-top: 4px; color: var(--dim); font-size: 13px; }
    .field { display: grid; gap: 5px; margin-top: 14px; }
    .field label { font-size: 12px; color: var(--dim); font-weight: 600; }
    .field input { height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--ink); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sheet__btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .sheet__btns button { height: 42px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 600; }
    .sheet__btns .ok { background: var(--ink); color: #14183a; }
    .sheet__btns .no { box-shadow: 0 0 0 1px var(--line) inset; }

    @media (max-width: 760px) {
      .stage { height: 420px; }
      .panel { position: relative; right: auto; bottom: auto; width: auto; margin: 0 12px 12px; }
      .picks { left: 12px; right: 12px; bottom: auto; top: 360px; display: flex; overflow-x: auto; scrollbar-width: none; }
      .pick { flex: none; }
      .pick small { display: none; }
      .top { padding: 16px; align-items: flex-start; }
      .top h1 { font-size: 17px; }
      .view button { padding: 6px 10px; }
    }
    @media (prefers-reduced-motion: reduce) { .cam, .lot, .btn, .pick { transition: none; } .glow, .live, .twinkle, .rv { animation: none; } }
  </style>
</head>
<body>

  <section class="city" data-city aria-label="Your offices"></section>
  <p class="note">Your offices share one block at dusk; the unlabelled buildings are scenery. Click a building, or use ← / →, to fly to it; drag to look around. Demo properties apart from Nagoya are made up. Pass your own to <code>PropertyCity.mount()</code>.</p>

  <script>
  /* =============================================================
     Iso — draws an isometric office building as SVG from a few numbers.
     Iso.building(p, { uid, theme }) → { defs, body, pin, box, pinAt, foot }
       p: { id, floors, floor, palette: [left, right, roof], w?, d? }
       body is in local units; the ground point under the footprint's front corner is near (0, 0).
     ============================================================= */
  const Iso = (() => {
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const seeded = (seed) => { let s = seed % 2147483647 || 7; return () => ((s = (s * 16807) % 2147483647), (s - 1) / 2147483646); };
    const hash = (str) => [...String(str)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
    const shade = (hex, t) => { const n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; return `rgb(${c.map((v) => Math.round(t < 0 ? v * (1 + t) : v + (255 - v) * t)).join(',')})`; };
    const DAY = {
      plateA: '#f6f8fd', plateB: '#dfe6f3', edgeR: '#b9c6df', edgeL: '#cfd8ea', path: 'rgba(255,255,255,.7)',
      glassHi: '#e9f1ff', lit: '#fff3cf', litP: 0.28, slab: 'rgba(255,255,255,.55)', slabShadow: 'rgba(60,70,110,.18)',
      tree: ['#5fae6e', '#4f9d5f', '#7cc487'], trunk: '#7a6a5a', bush: '#6cb87a', lamp: '#8a93b8', lampLight: '#fff4c9', lampGlow: 0,
      door: '#3f4766', accent: 'var(--accent)', shadow: 'rgba(60,80,130,.28)', roofUnit: '#f4f6fb', plate: true,
    };
    const c30 = Math.cos(Math.PI / 6), s30 = 0.5;

    function building(p, opt = {}) {
      const th = { ...DAY, ...(opt.theme || {}) };
      const uid = opt.uid || Math.random().toString(36).slice(2, 7);
      const s = opt.s || 20;
      const rnd = seeded(hash(p.id));
      const n = clamp(p.floors || 8, 2, 30);
      const w = p.w || (5 + Math.round(rnd() * 2)), d = p.d || (3.6 + Math.round(rnd() * 1.5));
      const gH = 1.5, fH = 1, H = gH + (n - 1) * fH + 0.35;
      const P = (x, y, z) => [(x - y) * c30 * s, (x + y) * s30 * s - z * s];
      const pt = (a) => a.map((v) => v.toFixed(1)).join(' ');
      const poly = (pts, attrs) => `<path d="M${pts.map(pt).join('L')}Z" ${attrs}/>`;
      const [L, R, T] = th.palette || p.palette || ['#f3c7dc', '#8e9cd8', '#a9dfe0'];
      const zOf = (f) => (f <= 1 ? 0 : gH + (f - 2) * fH), hOf = (f) => (f <= 1 ? gH : fH);
      const g = opt.plate ?? 2.2, gt = 0.35;
      let base = '';
      if (th.plate && g > 0) {
        base += poly([P(-g, -g, 0), P(w + g, -g, 0), P(w + g, d + g, 0), P(-g, d + g, 0)], `fill="url(#pl${uid})"`);
        base += poly([P(w + g, -g, 0), P(w + g, d + g, 0), P(w + g, d + g, -gt), P(w + g, -g, -gt)], `fill="${th.edgeR}"`);
        base += poly([P(-g, d + g, 0), P(w + g, d + g, 0), P(w + g, d + g, -gt), P(-g, d + g, -gt)], `fill="${th.edgeL}"`);
        base += poly([P(w * 0.45, d, 0), P(w * 0.62, d, 0), P(w * 0.62, d + g, 0), P(w * 0.45, d + g, 0)], `fill="${th.path}"`);
      }
      const [shx, shy] = P(w / 2 + 0.6, d / 2 + 0.6, 0);
      base += `<ellipse cx="${shx.toFixed(1)}" cy="${shy.toFixed(1)}" rx="${(w + d) * s * 0.55}" ry="${(w + d) * s * 0.2}" fill="url(#sh${uid})"/>`;

      const tree = (x, y, k) => {
        const [bx, by] = P(x, y, 0), r = (0.9 + rnd() * 0.5) * s * k;
        return `<g><rect x="${(bx - 1.5).toFixed(1)}" y="${(by - r * 1.2).toFixed(1)}" width="3" height="${(r * 1.2).toFixed(1)}" fill="${th.trunk}"/>
          <circle cx="${bx.toFixed(1)}" cy="${(by - r * 1.5).toFixed(1)}" r="${r.toFixed(1)}" fill="${th.tree[0]}"/>
          <circle cx="${(bx - r * 0.45).toFixed(1)}" cy="${(by - r * 1.25).toFixed(1)}" r="${(r * 0.7).toFixed(1)}" fill="${th.tree[1]}"/>
          <circle cx="${(bx + r * 0.3).toFixed(1)}" cy="${(by - r * 1.85).toFixed(1)}" r="${(r * 0.55).toFixed(1)}" fill="${th.tree[2]}"/></g>`;
      };
      const lamp = (x, y) => {
        const [bx, by] = P(x, y, 0), h = 3.4 * s, lx = bx + 12, ly = by - h - 9;
        return `${th.lampGlow ? `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="${(s * 1.4).toFixed(1)}" fill="url(#lg${uid})"/>` : ''}<path d="M${bx.toFixed(1)} ${by.toFixed(1)}V${(by - h).toFixed(1)}q0 -10 12 -10" fill="none" stroke="${th.lamp}" stroke-width="2.2" stroke-linecap="round"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.5" fill="${th.lampLight}"/>`;
      };
      const greenery = opt.greenery !== false;
      const back = greenery ? tree(-1.2, -1.1, 0.9) + tree(w + 1.2, -1.2, 0.8) + lamp(-1.6, d * 0.4) : '';
      const front = greenery ? tree(-1, d + 1.1, 1) + tree(w + 1.1, d * 0.55, 0.95) + tree(w * 0.25, d + 1.4, 0.8) + lamp(w + 1.9, d * 0.1)
        + `<g opacity=".9">${[[0.2, d + 0.5], [w - 0.4, d + 0.5], [w + 0.5, 0.3]].map(([x, y]) => { const [bx, by] = P(x, y, 0); return `<ellipse cx="${bx.toFixed(1)}" cy="${(by - 3).toFixed(1)}" rx="${s * 0.7}" ry="${s * 0.32}" fill="${th.bush}"/>`; }).join('')}</g>` : '';

      let bld = '';
      bld += poly([P(0, d, 0), P(w, d, 0), P(w, d, H), P(0, d, H)], `fill="url(#lf${uid})"`);
      bld += poly([P(w, 0, 0), P(w, d, 0), P(w, d, H), P(w, 0, H)], `fill="url(#rf${uid})"`);
      const cols = (len) => Math.max(3, Math.round(len / 0.9));
      for (let f = 1; f <= n; f++) {
        const z0 = zOf(f), h = hOf(f);
        if (f > 1) {
          bld += `<path d="M${pt(P(0, d, z0))}L${pt(P(w, d, z0))}L${pt(P(w, 0, z0))}" fill="none" stroke="${th.slab}" stroke-width="1.6"/>`;
          bld += `<path d="M${pt(P(0, d + 0.12, z0))}L${pt(P(w + 0.12, d + 0.12, z0))}L${pt(P(w + 0.12, 0, z0))}" fill="none" stroke="${th.slabShadow}" stroke-width="1"/>`;
        }
        const wz0 = z0 + h * (f === 1 ? 0.14 : 0.2), wz1 = z0 + h * (f === 1 ? 0.8 : 0.86);
        const cl = cols(w);
        for (let j = 0; j < cl; j++) {
          const x0 = 0.25 + (j * (w - 0.5)) / cl, x1 = x0 + ((w - 0.5) / cl) * 0.68;
          if (f === 1 && j >= Math.floor(cl * 0.45) && j <= Math.floor(cl * 0.6)) continue;
          const lit = rnd() < th.litP;
          bld += poly([P(x0, d, wz0), P(x1, d, wz0), P(x1, d, wz1), P(x0, d, wz1)], `fill="${lit ? th.lit : `url(#gl${uid})`}" opacity="${lit ? 0.95 : 0.9}"${lit ? ' data-lit' : ''}`);
        }
        const cr = cols(d);
        for (let j = 0; j < cr; j++) {
          const y0 = 0.22 + (j * (d - 0.44)) / cr, y1 = y0 + ((d - 0.44) / cr) * 0.7;
          const lit = rnd() < th.litP * 0.85;
          bld += poly([P(w, y0, wz0), P(w, y1, wz0), P(w, y1, wz1), P(w, y0, wz1)], `fill="${lit ? th.lit : `url(#gr${uid})`}" opacity="${lit ? 0.9 : 0.85}"${lit ? ' data-lit' : ''}`);
          if (!lit && f > 1) { const m = (wz0 + wz1) / 2; bld += `<path d="M${pt(P(w, y0, m))}L${pt(P(w, y1, m))}" stroke="rgba(255,255,255,.3)" stroke-width="1"/>`; }
        }
      }
      const dx0 = w * 0.46, dx1 = w * 0.6;
      bld += poly([P(dx0, d, 0), P(dx1, d, 0), P(dx1, d, gH * 0.75), P(dx0, d, gH * 0.75)], `fill="${th.door}"`);
      bld += poly([P(dx0 - 0.2, d + 0.35, gH * 0.85), P(dx1 + 0.2, d + 0.35, gH * 0.85), P(dx1 + 0.2, d, gH * 0.85), P(dx0 - 0.2, d, gH * 0.85)], `fill="${th.lit}" opacity=".85"`);
      bld += `<path d="M${pt(P(w, d, 0))}L${pt(P(w, d, H))}" stroke="rgba(255,255,255,.55)" stroke-width="2"/>`;
      bld += poly([P(0, 0, H), P(w, 0, H), P(w, d, H), P(0, d, H)], `fill="url(#rt${uid})"`);
      const i2 = 0.28;
      bld += poly([P(i2, i2, H), P(w - i2, i2, H), P(w - i2, d - i2, H), P(i2, d - i2, H)], `fill="${shade(T, -0.08)}" opacity=".55"`);
      const ux = w * 0.62, uy = d * 0.25, uw = 1.1, ud = 0.9, uh = 0.55;
      bld += poly([P(ux, uy + ud, H), P(ux + uw, uy + ud, H), P(ux + uw, uy + ud, H + uh), P(ux, uy + ud, H + uh)], `fill="${shade(L, -0.06)}"`);
      bld += poly([P(ux + uw, uy, H), P(ux + uw, uy + ud, H), P(ux + uw, uy + ud, H + uh), P(ux + uw, uy, H + uh)], `fill="${shade(R, -0.1)}"`);
      bld += poly([P(ux, uy, H + uh), P(ux + uw, uy, H + uh), P(ux + uw, uy + ud, H + uh), P(ux, uy + ud, H + uh)], `fill="${th.roofUnit}"`);

      // Your floor + hover bands
      let hl = '', hits = '', pinAt = null;
      for (let f = 1; f <= n; f++) {
        const z0 = zOf(f), z1 = z0 + hOf(f);
        const band = [P(0, d, z0), P(w, d, z0), P(w, 0, z0), P(w, 0, z1), P(w, d, z1), P(0, d, z1)];
        if (f === p.floor) {
          hl += `<g class="your-floor">${poly(band, `fill="${th.accent}" opacity=".28" class="glow"`)}

      return { defs, base, back, bld, hl, hits, front, body: `${base}${back}${bld}${hl}${hits}${front}`, box, pinAt, n, w, d, P };
    }

  })();


  window.PropertyCity = (() => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const { shade, hash, clamp } = Iso;
    const sv = (p, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
    const I = {
      add: sv('<path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/>', 1.7),
      enter: sv('<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M3 12h11M10 8l4 4-4 4"/>', 1.7),
    };
    const DUSK = {
      plateA: '#454a74', plateB: '#2f345c', edgeR: '#232845', edgeL: '#2b3154', path: 'rgba(255,220,170,.18)',
      glassHi: '#56609a', glassMid: '#2c3462', glassLo: '#1a1f42', glassHi2: '#48528a', glassMid2: '#252c58', glassLo2: '#161a39',
      lit: '#ffd58a', litP: 0.42, slab: 'rgba(255,255,255,.14)', slabShadow: 'rgba(0,0,0,.25)',
      tree: ['#2f6b5a', '#28594b', '#3d8270'], trunk: '#3e3532', bush: '#2a5f50', lamp: '#6f78a8', lampLight: '#ffe2a6', lampGlow: 1,
      door: '#12162e', shadow: 'rgba(0,0,0,.5)', roofUnit: '#5a628f', accent: '#ff8a3d',
    };
    const dusk = (pal) => [shade(pal[0], -0.38), shade(pal[1], -0.42), shade(pal[2], -0.3)].map((c) => {
      const m = c.match(/\d+/g).map(Number); return `#${m.map((v) => v.toString(16).padStart(2, '0')).join('')}`;
    });
    const s = 20, c30 = Math.cos(Math.PI / 6);
    const G = (x, y) => [(x - y) * c30 * s, (x + y) * 0.5 * s];

    function mount(el, cfg) {
      const props = cfg.properties.slice();

      el.innerHTML = `
        <header class="top">

        <div class="panel" data-panel aria-live="polite"></div>
        <div class="toast" aria-hidden="true"><p data-toast></p></div>

            <h2 id="addT">Add an office</h2><p class="lead">A new building goes up on the next free lot.</p>
            <div class="field"><label for="c-name">Name</label><input id="c-name" name="name" required placeholder="Kyoto Studio"></div>
            <div class="two"><div class="field"><label for="c-postal">Postal code</label><input id="c-postal" name="postal" placeholder="600-8216"></div>
              <div class="field"><label for="c-floor">Your floor</label><input id="c-floor" name="floor" type="number" min="1" max="30" value="3" required></div></div>
            <div class="field"><label for="c-addr">Address</label><input id="c-addr" name="address" required placeholder="Kyoto-fu, Kyoto-shi, Shimogyō-ku"></div>
            <div class="two"><div class="field"><label for="c-bld">Building</label><input id="c-bld" name="building"></div>

        const corners = [G(W0, W0), G(X1, W0), G(X1, Y1), G(W0, Y1)];
        let world = '';
        // Ground
        world += `<path d="M${corners.map((c) => c.map((v) => v.toFixed(1)).join(' ')).join('L')}Z" fill="#1c2042"/>`;
        const [a, b] = [G(X1, W0), G(X1, Y1)], [c, d] = [G(W0, Y1), G(X1, Y1)];
        world += `<path d="M${a.join(' ')}L${b.join(' ')}L${b[0]} ${b[1] + 10}L${a[0]} ${a[1] + 10}Z" fill="#14172f"/>`;
        world += `<path d="M${c.join(' ')}L${d.join(' ')}L${d[0]} ${d[1] + 10}L${c[0]} ${c[1] + 10}Z" fill="#181b37"/>`;
        // Road centre lines between lots
        for (let i = 1; i < 3; i++) { const x = i * SP - 3.1; world += `<path class="road-line" d="M${G(x, W0).join(' ')}L${G(x, Y1).join(' ')}"/>`; }
        for (let j = 1; j < rows; j++) { const y = j * SP - 3.1; world += `<path class="road-line" d="M${G(W0, y).join(' ')}L${G(X1, y).join(' ')}"/>`; }
        // A few headlights travelling the roads
        let cars = '';
        if (!reduce.matches) for (let i = 1; i < 3; i++) {

          const data = p

                <rect x="${lx}" y="${ly - 14}" width="104" height="30" rx="8"/><text x="${lx + 9}" y="${ly - 1}">${p.floor}F · Your office</text><text class="pin-sub" x="${lx + 9}" y="${ly + 10}">${p.here?.length || 0} here now</text></g>`;

            center: [ox + B.P(B.w / 2, B.d / 2, 0)[0], oy + (B.box.minY + B.box.maxY) / 2], pinAt: B.pinAt ? [ox + B.pinAt[0], oy + B.pinAt[1]] : null, k: lot.k });

        VB = { minX, minY, W: maxX - minX, H: maxY - minY };

      }
      function applyCam() { q('[data-cam]').style.transform = `translate(${cam.tx.toFixed(1)}px, ${cam.ty.toFixed(1)}px) scale(${cam.k.toFixed(3)})`; }

      q('[data-picks]').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go); });

        e.preventDefault();

        const p = { id: `p${Date.now()}`, name: f.get('name').trim(), postal: f.get('postal').trim(), address: f.get('address').trim(), building: f.get('building').trim(), city: 'New', floors, floor: clamp(+f.get('floor') || 1, 1, floors), seats: null, here: [], palette: pal[props.length % pal.length] };
