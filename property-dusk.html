<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property at dusk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================
       Property at dusk — the turntable slider, lit for evening: stars, lamps, windows coming on
       ========================================================= */
    :root {
      --ink: #f2f0ff;
      --dim: #a9acd0;
      --faint: #6f739c;
      --glass: rgba(20, 23, 48, .62);
      --line: rgba(242, 240, 255, .12);
      --accent: #ff8a3d;
      --cream: #fdebd3;
      --live: #3ddc97;
      --sans: 'Manrope', system-ui, sans-serif;
      --jp: 'Noto Sans JP', sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --io: cubic-bezier(.65, 0, .35, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #0c0e1f; }
    body { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: center; gap: 14px; padding: 36px 16px; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased;
      background: radial-gradient(900px 500px at 50% 0%, #1c2150, #0c0e1f 70%); }
    button, input, a { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .note { width: min(100%, 680px); color: var(--faint); font-size: 12px; line-height: 1.5; }
    .note code { font-size: 11px; }

    .dusk { position: relative; width: min(100%, 680px); padding: 22px 22px 24px; border-radius: 30px; overflow: hidden;
      background: linear-gradient(180deg, #171b3f, #121531); box-shadow: 0 0 0 1px var(--line), 0 40px 80px -30px rgba(0, 0, 0, .75); }

    /* Header */
    .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px; }
    .head h1 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
    .head h1 span { display: block; margin-top: 2px; color: var(--dim); font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    .head__r { display: flex; align-items: center; gap: 8px; }
    .count { min-width: 54px; text-align: center; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
    .count b { color: var(--ink); font-weight: 700; }
    .arrow { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.06); box-shadow: 0 0 0 1px var(--line) inset; transition: background-color .2s, transform .2s var(--ease); }
    .arrow:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
    .arrow svg { width: 16px; height: 16px; }

    /* Stage: the evening sky */
    .stage { position: relative; height: 440px; margin-top: 16px; border-radius: 24px; overflow: hidden; touch-action: pan-y;
      background: linear-gradient(180deg, #121636 0%, #252b5e 46%, #6b4f7d 74%, #d98a77 100%); box-shadow: 0 0 0 1px var(--line) inset; }
    .sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .twinkle { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 50% { opacity: .15; } }
    .moon { position: absolute; right: 13%; top: 9%; width: 44px; height: 44px; border-radius: 50%; background: #fff4d6; box-shadow: 0 0 30px 10px rgba(255, 231, 176, .35), 0 0 90px 30px rgba(255, 231, 176, .14); pointer-events: none; }
    .horizon { position: absolute; inset: auto 0 0; height: 34%; pointer-events: none; background: linear-gradient(180deg, transparent, rgba(255, 170, 130, .25)); }
    .clock { position: absolute; left: 16px; top: 14px; z-index: 12; display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border-radius: 999px; background: rgba(12, 14, 31, .45); backdrop-filter: blur(8px); box-shadow: 0 0 0 1px var(--line) inset; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .clock svg { width: 14px; height: 14px; color: #ffe2a6; }

    .slide { position: absolute; left: 50%; top: 18px; width: 72%; height: calc(100% - 86px); margin-left: -36%;
      transform: translateX(calc(var(--o) * 66%)) scale(calc(1 - var(--a) * .44)); transform-origin: 50% 88%;
      opacity: calc(1 - var(--a) * .45); filter: brightness(calc(1 - var(--a) * .45)) saturate(calc(1 - var(--a) * .4));
      transition: transform .9s var(--io), opacity .9s var(--io), filter .9s var(--io); cursor: pointer; z-index: calc(10 - var(--a)); }
    .slide[hidden] { display: block; visibility: hidden; opacity: 0; }
    .slide.is-current { cursor: default; }
    .slide svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .bld { transform-box: view-box; transition: transform 1.2s cubic-bezier(.7, 0, .84, 0), opacity .5s .7s; }
    .dusk.is-entering .slide.is-current .bld { transform: scale(4.2); opacity: 0; }
    .slide:not(.is-current) .your-floor, .slide:not(.is-current) .pin { opacity: 0; }
    .your-floor, .pin { transition: opacity .5s .4s; }
    .glow { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .5; } }
    .floor-hit { fill: transparent; cursor: pointer; }
    .floor-hover { opacity: 0; transition: opacity .15s; pointer-events: none; }
    .slide.is-current [data-floor]:hover .floor-hover { opacity: .6; }
    [data-lit], .win { transition: fill .8s; }
    .pin rect { fill: #fff; }
    .pin text { fill: #14183a; font: 700 12px var(--sans); }
    .pin .pin-sub { fill: #6a6f95; font: 500 10px var(--sans); }
    .dusk.is-entering .pin { opacity: 0; transition-delay: 0s; }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-5px); } }

    .dots { position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%); z-index: 12; display: flex; gap: 6px; padding: 6px 8px; border-radius: 999px; background: rgba(12, 14, 31, .45); backdrop-filter: blur(8px); }
    .dots button { width: 7px; height: 7px; border-radius: 999px; background: rgba(255, 255, 255, .3); transition: width .4s var(--ease), background-color .3s; }
    .dots button[aria-current="true"] { width: 22px; background: var(--accent); }

    /* Info: dark glass over the foot of the stage */
    .info { position: relative; z-index: 13; margin: -46px 14px 0; padding: 16px 18px; border-radius: 22px; background: var(--glass); backdrop-filter: blur(18px) saturate(1.2);
      box-shadow: 0 0 0 1px var(--line) inset, 0 20px 40px -20px rgba(0,0,0,.6); }
    .i-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .i-kick { color: var(--dim); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .i-name { margin-top: 3px; font-size: 21px; font-weight: 700; letter-spacing: -.015em; line-height: 1.15; }
    .badge { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 8px; border-radius: 999px; background: var(--accent); color: #1a1430; font-size: 12px; font-weight: 700; }
    .badge i { width: 7px; height: 7px; border-radius: 50%; background: #fff; }
    .i-addr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; margin-top: 10px; }
    .i-addr p { color: #d6d7ee; font-size: 13.5px; line-height: 1.5; }
    .i-addr small { display: block; color: var(--dim); font: 400 12px/1.5 var(--jp); }
    .tools { display: flex; gap: 6px; }
    .tool { position: relative; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: rgba(255,255,255,.07); box-shadow: 0 0 0 1px var(--line) inset; text-decoration: none; transition: background-color .2s; }
    .tool:hover { background: rgba(255,255,255,.14); }
    .tool svg { width: 16px; height: 16px; }
    .tool[data-done]::after { content: attr(data-done); position: absolute; bottom: calc(100% + 6px); right: 0; padding: 3px 7px; border-radius: 6px; background: #fff; color: #14183a; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 14px; border-top: 1px solid var(--line); }
    .stats div { padding-top: 12px; }
    .stats div + div { padding-left: 12px; border-left: 1px solid var(--line); }
    .stats dt { color: var(--dim); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .stats dd { margin-top: 5px; display: flex; align-items: center; gap: 7px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .faces { display: inline-flex; }
    .faces i { width: 20px; height: 20px; margin-left: -6px; border-radius: 50%; display: grid; place-items: center; border: 2px solid #1d2147; background: var(--c); color: #fff; font: 700 8px/1 var(--sans); font-style: normal; }
    .faces i:first-child { margin-left: 0; }
    .live { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: live 2s infinite; }
    @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(61,220,151,.5); } 70%, 100% { box-shadow: 0 0 0 7px rgba(61,220,151,0); } }
    .rv { animation: up .6s var(--ease) both; animation-delay: calc(var(--d, 0) * 50ms); }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } }

    .actions { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
    .btn { display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 28px; border-radius: 999px; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; transition: transform .25s var(--ease), box-shadow .25s; }
    .btn svg { width: 20px; height: 20px; transition: transform .3s var(--ease); }
    .btn:hover { transform: translateY(-2px); }
    .btn--add { background: var(--cream); color: #1a1430; }
    .btn--add:hover svg { transform: translateY(-2px); }
    .btn--enter { background: linear-gradient(135deg, #ffb36b, var(--accent) 55%, #f06a2a); color: #1a1430; box-shadow: 0 14px 30px -14px rgba(255, 138, 61, .7); }
    .btn--enter:hover svg { transform: translateX(3px); }

    .veil { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(12, 14, 31, 0); pointer-events: none; transition: background-color .6s .6s; text-align: center; }
    .veil p { opacity: 0; transform: translateY(8px); transition: opacity .4s 1s, transform .5s 1s var(--ease); font-size: 19px; font-weight: 700; }
    .veil small { display: block; margin-top: 4px; color: var(--dim); font-size: 13px; font-weight: 500; }
    .dusk.is-entering .veil { background: rgba(12, 14, 31, .9); }
    .dusk.is-entering .veil p { opacity: 1; transform: none; }

    dialog { width: min(92vw, 420px); margin: auto; padding: 0; border: 0; border-radius: 24px; background: #161a3a; color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 40px 80px -30px rgba(0,0,0,.8); }
    dialog::backdrop { background: rgba(5, 6, 15, .5); backdrop-filter: blur(4px); }
    dialog[open] { animation: sheet .4s var(--ease); }
    @keyframes sheet { from { opacity: 0; transform: translateY(14px) scale(.98); } }
    .sheet { padding: 22px; }
    .sheet h2 { font-size: 18px; }
    .sheet .lead { margin-top: 4px; color: var(--dim); font-size: 13px; }
    .field { display: grid; gap: 5px; margin-top: 14px; }
    .field label { font-size: 12px; color: var(--dim); font-weight: 600; }
    .field input { height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--ink); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sheet__btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .sheet__btns button { height: 42px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 600; }
    .sheet__btns .ok { background: var(--accent); color: #1a1430; }
    .sheet__btns .no { box-shadow: 0 0 0 1px var(--line) inset; }

    @media (max-width: 560px) {
      .dusk { padding: 16px 12px 18px; border-radius: 24px; }
      .head h1 { font-size: 19px; }
      .stage { height: 360px; }
      .slide { width: 86%; margin-left: -43%; }
      .info { margin: -46px 4px 0; padding: 14px; }
      .i-name { font-size: 18px; }
      .stats dd { font-size: 18px; }
      .faces { display: none; }
      .btn { height: 50px; padding: 0 18px; font-size: 12.5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .slide, .bld, .btn, .dots button, [data-lit], .win { transition: none; }
      .twinkle, .glow, .live, .rv, .float { animation: none; }
    }
  </style>
</head>
<body>

  <section class="dusk" data-dusk aria-roledescription="carousel" aria-label="Properties"></section>
  <p class="note">The property-card turntable at dusk: windows switch on and off, lamps glow, and your floor lights up orange. Hover the building to read its floors. Demo properties apart from Nagoya are made up. Pass your own to <code>PropertyDusk.mount()</code>.</p>

  <script>
  /* =============================================================
     Iso — draws an isometric office building as SVG from a few numbers.
     Iso.building(p, { uid, theme }) → { defs, body, pin, box, pinAt, foot }
       p: { id, floors, floor, palette: [left, right, roof], w?, d? }
       body is in local units; the ground point under the footprint's front corner is near (0, 0).
     ============================================================= */
  const Iso = (() => {
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const seeded = (seed) => { let s = seed % 2147483647 || 7; return () => ((s = (s * 16807) % 2147483647), (s - 1) / 2147483646); };
    const hash = (str) => [...String(str)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
    const shade = (hex, t) => { const n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; return `rgb(${c.map((v) => Math.round(t < 0 ? v * (1 + t) : v + (255 - v) * t)).join(',')})`; };
    const DAY = {
      plateA: '#f6f8fd', plateB: '#dfe6f3', edgeR: '#b9c6df', edgeL: '#cfd8ea', path: 'rgba(255,255,255,.7)',
      glassHi: '#e9f1ff', lit: '#fff3cf', litP: 0.28, slab: 'rgba(255,255,255,.55)', slabShadow: 'rgba(60,70,110,.18)',
      tree: ['#5fae6e', '#4f9d5f', '#7cc487'], trunk: '#7a6a5a', bush: '#6cb87a', lamp: '#8a93b8', lampLight: '#fff4c9', lampGlow: 0,
      door: '#3f4766', accent: 'var(--accent)', shadow: 'rgba(60,80,130,.28)', roofUnit: '#f4f6fb', plate: true,
    };
    const c30 = Math.cos(Math.PI / 6), s30 = 0.5;

    function building(p, opt = {}) {
      const th = { ...DAY, ...(opt.theme || {}) };
      const uid = opt.uid || Math.random().toString(36).slice(2, 7);
      const s = opt.s || 20;
      const rnd = seeded(hash(p.id));
      const n = clamp(p.floors || 8, 2, 30);
      const w = p.w || (5 + Math.round(rnd() * 2)), d = p.d || (3.6 + Math.round(rnd() * 1.5));
      const gH = 1.5, fH = 1, H = gH + (n - 1) * fH + 0.35;
      const P = (x, y, z) => [(x - y) * c30 * s, (x + y) * s30 * s - z * s];
      const pt = (a) => a.map((v) => v.toFixed(1)).join(' ');
      const poly = (pts, attrs) => `<path d="M${pts.map(pt).join('L')}Z" ${attrs}/>`;
      const [L, R, T] = th.palette || p.palette || ['#f3c7dc', '#8e9cd8', '#a9dfe0'];
      const zOf = (f) => (f <= 1 ? 0 : gH + (f - 2) * fH), hOf = (f) => (f <= 1 ? gH : fH);
      const g = opt.plate ?? 2.2, gt = 0.35;
      let base = '';
      if (th.plate && g > 0) {
        base += poly([P(-g, -g, 0), P(w + g, -g, 0), P(w + g, d + g, 0), P(-g, d + g, 0)], `fill="url(#pl${uid})"`);
        base += poly([P(w + g, -g, 0), P(w + g, d + g, 0), P(w + g, d + g, -gt), P(w + g, -g, -gt)], `fill="${th.edgeR}"`);
        base += poly([P(-g, d + g, 0), P(w + g, d + g, 0), P(w + g, d + g, -gt), P(-g, d + g, -gt)], `fill="${th.edgeL}"`);
        base += poly([P(w * 0.45, d, 0), P(w * 0.62, d, 0), P(w * 0.62, d + g, 0), P(w * 0.45, d + g, 0)], `fill="${th.path}"`);
      }
      const [shx, shy] = P(w / 2 + 0.6, d / 2 + 0.6, 0);
      base += `<ellipse cx="${shx.toFixed(1)}" cy="${shy.toFixed(1)}" rx="${(w + d) * s * 0.55}" ry="${(w + d) * s * 0.2}" fill="url(#sh${uid})"/>`;

      const tree = (x, y, k) => {
        const [bx, by] = P(x, y, 0), r = (0.9 + rnd() * 0.5) * s * k;
        return `<g><rect x="${(bx - 1.5).toFixed(1)}" y="${(by - r * 1.2).toFixed(1)}" width="3" height="${(r * 1.2).toFixed(1)}" fill="${th.trunk}"/>
          <circle cx="${bx.toFixed(1)}" cy="${(by - r * 1.5).toFixed(1)}" r="${r.toFixed(1)}" fill="${th.tree[0]}"/>
          <circle cx="${(bx - r * 0.45).toFixed(1)}" cy="${(by - r * 1.25).toFixed(1)}" r="${(r * 0.7).toFixed(1)}" fill="${th.tree[1]}"/>
          <circle cx="${(bx + r * 0.3).toFixed(1)}" cy="${(by - r * 1.85).toFixed(1)}" r="${(r * 0.55).toFixed(1)}" fill="${th.tree[2]}"/></g>`;
      };
      const lamp = (x, y) => {
        const [bx, by] = P(x, y, 0), h = 3.4 * s, lx = bx + 12, ly = by - h - 9;
        return `${th.lampGlow ? `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="${(s * 1.4).toFixed(1)}" fill="url(#lg${uid})"/>` : ''}<path d="M${bx.toFixed(1)} ${by.toFixed(1)}V${(by - h).toFixed(1)}q0 -10 12 -10" fill="none" stroke="${th.lamp}" stroke-width="2.2" stroke-linecap="round"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.5" fill="${th.lampLight}"/>`;
      };
      const greenery = opt.greenery !== false;
      const back = greenery ? tree(-1.2, -1.1, 0.9) + tree(w + 1.2, -1.2, 0.8) + lamp(-1.6, d * 0.4) : '';
      const front = greenery ? tree(-1, d + 1.1, 1) + tree(w + 1.1, d * 0.55, 0.95) + tree(w * 0.25, d + 1.4, 0.8) + lamp(w + 1.9, d * 0.1)
        + `<g opacity=".9">${[[0.2, d + 0.5], [w - 0.4, d + 0.5], [w + 0.5, 0.3]].map(([x, y]) => { const [bx, by] = P(x, y, 0); return `<ellipse cx="${bx.toFixed(1)}" cy="${(by - 3).toFixed(1)}" rx="${s * 0.7}" ry="${s * 0.32}" fill="${th.bush}"/>`; }).join('')}</g>` : '';

      let bld = '';
      bld += poly([P(0, d, 0), P(w, d, 0), P(w, d, H), P(0, d, H)], `fill="url(#lf${uid})"`);
      bld += poly([P(w, 0, 0), P(w, d, 0), P(w, d, H), P(w, 0, H)], `fill="url(#rf${uid})"`);
      const cols = (len) => Math.max(3, Math.round(len / 0.9));
      for (let f = 1; f <= n; f++) {
        const z0 = zOf(f), h = hOf(f);
        if (f > 1) {
          bld += `<path d="M${pt(P(0, d, z0))}L${pt(P(w, d, z0))}L${pt(P(w, 0, z0))}" fill="none" stroke="${th.slab}" stroke-width="1.6"/>`;
          bld += `<path d="M${pt(P(0, d + 0.12, z0))}L${pt(P(w + 0.12, d + 0.12, z0))}L${pt(P(w + 0.12, 0, z0))}" fill="none" stroke="${th.slabShadow}" stroke-width="1"/>`;
        }
        const wz0 = z0 + h * (f === 1 ? 0.14 : 0.2), wz1 = z0 + h * (f === 1 ? 0.8 : 0.86);
        const cl = cols(w);
        for (let j = 0; j < cl; j++) {
          const x0 = 0.25 + (j * (w - 0.5)) / cl, x1 = x0 + ((w - 0.5) / cl) * 0.68;
          if (f === 1 && j >= Math.floor(cl * 0.45) && j <= Math.floor(cl * 0.6)) continue;
          const lit = rnd() < th.litP;
          bld += poly([P(x0, d, wz0), P(x1, d, wz0), P(x1, d, wz1), P(x0, d, wz1)], `fill="${lit ? th.lit : `url(#gl${uid})`}" opacity="${lit ? 0.95 : 0.9}"${lit ? ' data-lit' : ''}`);
        }
        const cr = cols(d);
        for (let j = 0; j < cr; j++) {
          const y0 = 0.22 + (j * (d - 0.44)) / cr, y1 = y0 + ((d - 0.44) / cr) * 0.7;
          const lit = rnd() < th.litP * 0.85;
          bld += poly([P(w, y0, wz0), P(w, y1, wz0), P(w, y1, wz1), P(w, y0, wz1)], `fill="${lit ? th.lit : `url(#gr${uid})`}" opacity="${lit ? 0.9 : 0.85}"${lit ? ' data-lit' : ''}`);
          if (!lit && f > 1) { const m = (wz0 + wz1) / 2; bld += `<path d="M${pt(P(w, y0, m))}L${pt(P(w, y1, m))}" stroke="rgba(255,255,255,.3)" stroke-width="1"/>`; }
        }
      }
      const dx0 = w * 0.46, dx1 = w * 0.6;
      bld += poly([P(dx0, d, 0), P(dx1, d, 0), P(dx1, d, gH * 0.75), P(dx0, d, gH * 0.75)], `fill="${th.door}"`);
      bld += poly([P(dx0 - 0.2, d + 0.35, gH * 0.85), P(dx1 + 0.2, d + 0.35, gH * 0.85), P(dx1 + 0.2, d, gH * 0.85), P(dx0 - 0.2, d, gH * 0.85)], `fill="${th.lit}" opacity=".85"`);
      bld += `<path d="M${pt(P(w, d, 0))}L${pt(P(w, d, H))}" stroke="rgba(255,255,255,.55)" stroke-width="2"/>`;
      bld += poly([P(0, 0, H), P(w, 0, H), P(w, d, H), P(0, d, H)], `fill="url(#rt${uid})"`);
      const i2 = 0.28;
      bld += poly([P(i2, i2, H), P(w - i2, i2, H), P(w - i2, d - i2, H), P(i2, d - i2, H)], `fill="${shade(T, -0.08)}" opacity=".55"`);
      const ux = w * 0.62, uy = d * 0.25, uw = 1.1, ud = 0.9, uh = 0.55;
      bld += poly([P(ux, uy + ud, H), P(ux + uw, uy + ud, H), P(ux + uw, uy + ud, H + uh), P(ux, uy + ud, H + uh)], `fill="${shade(L, -0.06)}"`);
      bld += poly([P(ux + uw, uy, H), P(ux + uw, uy + ud, H), P(ux + uw, uy + ud, H + uh), P(ux + uw, uy, H + uh)], `fill="${shade(R, -0.1)}"`);
      bld += poly([P(ux, uy, H + uh), P(ux + uw, uy, H + uh), P(ux + uw, uy + ud, H + uh), P(ux, uy + ud, H + uh)], `fill="${th.roofUnit}"`);

      // Your floor + hover bands
      let hl = '', hits = '', pinAt = null;
      for (let f = 1; f <= n; f++) {
        const z0 = zOf(f), z1 = z0 + hOf(f);
        const band = [P(0, d, z0), P(w, d, z0), P(w, 0, z0), P(w, 0, z1), P(w, d, z1), P(0, d, z1)];
        if (f === p.floor) {
          hl += `<g class="your-floor">${poly(band, `fill="${th.accent}" opacity=".28" class="glow"`)}
            <path d="M${pt(P(0, d, z0))}L${pt(P(w, d, z0))}L${pt(P(w, 0, z0))}M${pt(P(0, d, z1))}L${pt(P(w, d, z1))}L${pt(P(w, 0, z1))}" fill="none" stroke="${th.accent}" stroke-width="2.4" stroke-linejoin="round"/></g>`;

      const xs = ext.map((e) => e[0]), ys = ext.map((e) => e[1]);

      const defs = `
        <linearGradient id="lf${uid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${shade(L, 0.12)}"/><stop offset="1" stop-color="${shade(L, -0.06)}"/></linearGradient>
        <linearGradient id="rf${uid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${shade(R, 0.1)}"/><stop offset="1" stop-color="${shade(R, -0.12)}"/></linearGradient>
        <linearGradient id="rt${uid}" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="${shade(L, 0.2)}"/><stop offset="1" stop-color="${T}"/></linearGradient>
        <linearGradient id="gl${uid}" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="${th.glassHi}"/><stop offset=".55" stop-color="${th.glassMid || shade(R, -0.15)}"/><stop offset="1" stop-color="${th.glassLo || shade(R, -0.32)}"/></linearGradient>
        <linearGradient id="gr${uid}" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="${th.glassHi2 || th.glassHi}"/><stop offset=".5" stop-color="${th.glassMid2 || shade(R, -0.28)}"/><stop offset="1" stop-color="${th.glassLo2 || shade(R, -0.42)}"/></linearGradient>
        <linearGradient id="pl${uid}" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="${th.plateA}"/><stop offset="1" stop-color="${th.plateB}"/></linearGradient>
        <radialGradient id="sh${uid}"><stop offset="0" stop-color="${th.shadow}"/><stop offset="1" stop-color="rgba(0,0,0,0)"/></radialGradient>
        <radialGradient id="lg${uid}"><stop offset="0" stop-color="${th.lampLight}" stop-opacity=".55"/><stop offset="1" stop-color="${th.lampLight}" stop-opacity="0"/></radialGradient>`;

    }

  })();


  window.PropertyDusk = (() => {

    const sv = (p, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
    const I = {
      prev: sv('<path d="M15 5l-7 7 7 7"/>'), next: sv('<path d="M9 5l7 7-7 7"/>'),
      add: sv('<path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/>', 1.7),
      enter: sv('<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M3 12h11M10 8l4 4-4 4"/>', 1.7),
      copy: sv('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'),
      map: sv('<path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4z"/><path d="M9 4v13.5M15 6.5V20"/>'),
      moon: sv('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>', 1.8),
    };
    const DUSK = {
      plateA: '#454a74', plateB: '#2f345c', edgeR: '#1e2240', edgeL: '#272c4f', path: 'rgba(255,220,170,.2)',
      glassHi: '#56609a', glassMid: '#2c3462', glassLo: '#1a1f42', glassHi2: '#48528a', glassMid2: '#252c58', glassLo2: '#161a39',
      lit: '#ffd58a', litP: 0.4, slab: 'rgba(255,255,255,.14)', slabShadow: 'rgba(0,0,0,.25)',
      tree: ['#2f6b5a', '#28594b', '#3d8270'], trunk: '#3e3532', bush: '#2a5f50', lamp: '#6f78a8', lampLight: '#ffe2a6', lampGlow: 1,
      door: '#12162e', shadow: 'rgba(0,0,0,.5)', roofUnit: '#5a628f', accent: '#ff8a3d',
    };
    const toHex = (c) => `#${c.match(/\d+/g).map((v) => (+v).toString(16).padStart(2, '0')).join('')}`;
    const dusk = (pal) => [toHex(shade(pal[0], -0.36)), toHex(shade(pal[1], -0.4)), toHex(shade(pal[2], -0.28))];
    const FACE = ['#f2a65a', '#6aa5e8', '#a78bfa', '#f472b6', '#34b39a', '#e8a33d'];
    const PAL = [['#f3c7dc', '#8e9cd8', '#a9dfe0'], ['#fde2c4', '#9fb5e8', '#cfe9d9'], ['#e5dcff', '#9a8fd8', '#bde7f0'], ['#d4f1e4', '#7fb3c9', '#ffe6b0']];

    function mount(el, cfg) {

      let i = 0, uidN = 0, flick = 0;
      el.innerHTML = `

              <div class="field"><label for="d-floor">Your floor</label><input id="d-floor" name="floor" type="number" min="1" max="30" value="3" required></div></div>

              <div class="field"><label for="d-floors">Storeys</label><input id="d-floors" name="floors" type="number" min="2" max="30" value="6" required></div></div>
            <div class="sheet__btns"><button class="no" type="button" data-cancel>Cancel</button><button class="ok" value="ok">Add property</button></div>

      const q = (s) => el.querySelector(s);
      const track = q('[data-track]');

      // Sky: stars + a moon
      (function sky() {
        const r = ((x) => () => ((x = (x * 16807) % 2147483647), (x - 1) / 2147483646))(424242); r(); r();
        q('[data-sky]').setAttribute('viewBox', '0 0 100 100');
        q('[data-sky]').setAttribute('preserveAspectRatio', 'none');
        q('[data-sky]').innerHTML = `<defs><radialGradient id="mg"><stop offset="0" stop-color="#fff6dc"/><stop offset=".5" stop-color="#ffe7b0" stop-opacity=".22"/><stop offset="1" stop-color="#ffe7b0" stop-opacity="0"/></radialGradient></defs>
          ${Array.from({ length: 46 }, (_, k) => `<ellipse class="${k % 3 ? '' : 'twinkle'}" style="animation-delay:${(k % 7) * .45}s" cx="${(r() * 100).toFixed(1)}" cy="${(r() * 48).toFixed(1)}" rx="${(0.12 + r() * 0.2).toFixed(2)}" ry="${(0.2 + r() * 0.3).toFixed(2)}" fill="#fff" opacity="${(0.3 + r() * 0.6).toFixed(2)}"/>`).join('')}`;
      })();

      function art(p) {
        const uid = `d${++uidN}`;
        const B = Iso.building({ ...p, palette: dusk(p.palette || PAL[hash(p.id) % PAL.length]) }, { uid, theme: DUSK });
        let pin = '';
        if (B.pinAt) {
          const [px, py] = B.pinAt, lx = px + 44, ly = py - 30;
          pin = `<g class="pin"><g class="float"><path d="M${px.toFixed(1)} ${py.toFixed(1)}L${(lx - 7).toFixed(1)} ${(ly + 7).toFixed(1)}H${lx}" stroke="#fff" stroke-width="1.3" fill="none"/>
            <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" fill="var(--accent)" stroke="#fff" stroke-width="2"/>
            <rect x="${lx}" y="${ly - 17}" width="112" height="34" rx="10"/><text x="${lx + 10}" y="${ly - 2}">${p.floor}F · Your office</text><text class="pin-sub" x="${lx + 10}" y="${ly + 11}">${p.here?.length || 0} here now</text></g></g>`;
        }
        const minX = B.box.minX - 10, maxX = B.box.maxX + 10 + (B.pinAt ? 60 : 0), minY = B.box.minY + 20, maxY = B.box.maxY + 10;
        return `<svg viewBox="${minX.toFixed(0)} ${minY.toFixed(0)} ${(maxX - minX).toFixed(0)} ${(maxY - minY).toFixed(0)}" preserveAspectRatio="xMidYMax meet" role="img" aria-label="${p.name}: ${p.floors}-storey building, your office on floor ${p.floor}">
          <defs>${B.defs}</defs><g class="bld" style="transform-origin:${B.pinAt ? `${B.pinAt[0].toFixed(0)}px ${B.pinAt[1].toFixed(0)}px` : 'center'}">${B.body}</g>${pin}</svg>`;
      }

      function slides() {
        track.innerHTML = props.map((p, k) => `<div class="slide" data-k="${k}">${art(p)}</div>`).join('');
        // tag unlit windows so they can switch on later
        track.querySelectorAll('.bld path[fill^="url(#gl"], .bld path[fill^="url(#gr"]').forEach((w) => w.classList.add('win'));
        q('[data-dots]').innerHTML = props.map((p, k) => `<button type="button" role="tab" data-go="${k}" aria-label="${p.name}"></button>`).join('');

      function place() {
        const N = props.length;
        track.querySelectorAll('.slide').forEach((s) => {

          s.style.setProperty('--o', o); s.style.setProperty('--a', Math.min(Math.abs(o), 2));

        q('[data-count]').innerHTML = `<b>${String(i + 1).padStart(2, '0')}</b> / ${String(N).padStart(2, '0')}`;
        q('[data-sub]').textContent = `${N} offices · ${props.reduce((a, p) => a + (p.here?.length || 0), 0)} people in now`;

      }
      function info() {
        const p = props[i], here = p.here || [];
        q('[data-info]').innerHTML = `
          <div class="i-top"><div><p class="i-kick rv">${p.city || 'Office'}${p.building ? ` · ${p.building.replace(/\s*\d+F$/, '')}` : ''}</p><h2 class="i-name rv" style="--d:1">${p.name}</h2></div><span class="badge rv" style="--d:1"><i aria-hidden="true"></i>${p.floor}F</span></div>

      const tick = () => { q('[data-clock]').innerHTML = `${I.moon}${new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo' })} JST`; };

      el.addEventListener('keydown', (e) => { if (e.target.closest('dialog, input')) return; if (e.key === 'ArrowRight') go(i + 1); if (e.key === 'ArrowLeft') go(i - 1); });

      stage.addEventListener('pointerup', (e) => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); });

        const f = e.target.closest('[data-floor]'); if (!f || !f.closest('.is-current')) return;
        const n = +f.dataset.floor, p = props[i];

      });

        const b = e.target.closest('[data-copy]'); if (!b) return;
        const p = props[i], txt = [p.postal && `〒${p.postal}`, p.addressJa || p.address, p.building].filter(Boolean).join(' ');

        setTimeout(() => delete b.dataset.done, 1400);
      });
      q('[data-enter]').addEventListener('click', () => {
        if (el.classList.contains('is-entering')) return;
        const p = props[i];
        q('[data-veil]').innerHTML = `Entering ${p.name}<small>${p.floor}F · ${p.here?.length || 0} people here</small>`;
        el.classList.add('is-entering');
        setTimeout(() => { cfg.onEnter?.(p); el.classList.remove('is-entering'); }, 2500);
      });

      q('[data-add]').addEventListener('click', () => { form.reset(); dlg.showModal(); });
      q('[data-cancel]').addEventListener('click', () => dlg.close());
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const f = new FormData(form), floors = clamp(+f.get('floors') || 6, 2, 30);
        const p = { id: `p${Date.now()}`, name: f.get('name').trim(), postal: f.get('postal').trim(), address: f.get('address').trim(), building: f.get('building').trim(), floors, floor: clamp(+f.get('floor') || 1, 1, floors), seats: null, here: [], palette: PAL[props.length % PAL.length] };

      return { go };
    }
    return { mount };
  })();

  PropertyDusk.mount(document.querySelector('[data-dusk]'), {
    properties: [
      { id: 'nagoya', name: 'Nagoya Test Office', city: 'Nagoya', postal: '460-0003', address: 'Aichi-ken, Nagoya-shi, Naka-ku', addressJa: '愛知県名古屋市中区', building: 'Takisada Building 7F', floors: 9, floor: 7, seats: 40, here: ['AK', 'MS', 'YT', 'RN', 'HI'], palette: ['#f3c7dc', '#8e9cd8', '#a9dfe0'] },
      { id: 'shibuya', name: 'Shibuya HQ', city: 'Tokyo', postal: '150-0002', address: 'Tokyo-to, Shibuya-ku, Shibuya', addressJa: '東京都渋谷区渋谷', building: 'Miyamasu Square 11F', floors: 14, floor: 11, seats: 120, here: ['KO', 'EN', 'SA', 'JM', 'TK', 'LU', 'AY', 'MR'], palette: ['#fde2c4', '#9fb5e8', '#cfe9d9'] },
      { id: 'umeda', name: 'Osaka Studio', city: 'Osaka', postal: '530-0001', address: 'Osaka-fu, Osaka-shi, Kita-ku, Umeda', addressJa: '大阪府大阪市北区梅田', building: 'Kitano Terrace 3F', floors: 6, floor: 3, seats: 24, here: ['RI', 'DS'], palette: ['#e5dcff', '#9a8fd8', '#bde7f0'] },
      { id: 'hakata', name: 'Fukuoka Hub', city: 'Fukuoka', postal: '812-0011', address: 'Fukuoka-ken, Fukuoka-shi, Hakata-ku', addressJa: '福岡県福岡市博多区博多駅前', building: 'Ekimae Annex 5F', floors: 8, floor: 5, seats: 32, here: [], palette: ['#d4f1e4', '#7fb3c9', '#ffe6b0'] },
    ],
