<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command palette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    // Apply the saved theme before first paint so there's no flash.
    (() => {
      let t = 'light';
      try { t = (JSON.parse(localStorage.getItem('command-palette:demo') || '{}').theme) || 'light'; } catch {}
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    :root {
      --bg-1: #f5f3ee; --bg-2: #f2efe6; --bg-3: #fbeec0; --glow: #f8d66e8c;
      --card: #fffdf8a8;
      --card-2: #fffdf8db;
      --solid: #f9f7f1;
      --hair: #ffffffe6;
      --line: #1d1d1b17;
      --line-2: #1d1d1b29;
      --hl: #1d1d1b0c;
      --ink: #1d1d1b;
      --dim: #5c5a54;
      --faint: #75726a;
      --honey: #f6c343;
      --honey-2: #fbe29a;
      --honey-ink: #5a4306;
      --night: #252523;
      --night-ink: #f4f2ec;
      --kbd: #ffffff;
      --shadow: 0 1px 0 #fffc inset, 0 18px 40px -26px #3c321459;
      --font-display: "Outfit", system-ui, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --back: cubic-bezier(.34, 1.7, .64, 1);
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg-1: #1d1c1a; --bg-2: #22211e; --bg-3: #2e2817; --glow: #f6c3432e;
      --card: #2a2926cc;
      --card-2: #34332fe6;
      --solid: #262522;
      --hair: #ffffff12;
      --line: #ffffff17;
      --line-2: #ffffff2b;
      --hl: #ffffff10;
      --ink: #f1efe8;
      --dim: #b5b2a8;
      --faint: #8f8c82;
      --night: #f1efe8;
      --night-ink: #1d1d1b;
      --kbd: #3a3935;
      --shadow: 0 1px 0 #ffffff0d inset, 0 18px 40px -26px #000000b3;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      padding: 16px;
      color: var(--ink);
      font: 400 14px/1.45 var(--font-body);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(90% 70% at 100% 100%, var(--glow), transparent 70%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
      transition: background-color .4s;
    }

    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; padding: 0; }
    h1, h2, p, ul { margin: 0; }
    ul { padding: 0; list-style: none; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .ico {
      width: 18px; height: 18px; flex: none;
      fill: none; stroke: currentColor; stroke-width: 1.7px;
      stroke-linecap: round; stroke-linejoin: round;
    }

    kbd {
      display: inline-grid; place-items: center;
      min-width: 20px; height: 20px;
      padding: 0 5px;
      border-radius: 6px;
      background: var(--kbd);
      box-shadow: 0 0 0 1px var(--line) inset, 0 1px 0 var(--line-2);
      color: var(--dim);
      font: 500 11px/1 var(--font-body);
    }

    /* =========================================================
       Demo surface (not part of the palette)
       ========================================================= */
    .demo {
      width: min(100%, 560px);
      padding: 24px;
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow), 0 0 0 1px var(--hair) inset;
      transition: padding .3s var(--ease);
    }
    .demo[data-density="compact"] { padding: 16px; }
    .demo__title { font: 300 clamp(28px, 6vw, 40px)/1.05 var(--font-display); letter-spacing: -.02em; }
    .demo__sub { margin-top: 8px; color: var(--dim); font-size: 13px; }
    .demo__sub b { color: var(--ink); font-weight: 500; }

    .trigger {
      display: flex; align-items: center; gap: 10px;
      width: 100%; height: 48px;
      margin: 20px 0 22px;
      padding: 0 10px 0 16px;
      border-radius: 999px;
      background: var(--card-2);
      box-shadow: 0 0 0 1px var(--line) inset;
      color: var(--faint);
      text-align: left;
      transition: box-shadow .3s var(--ease);
    }
    .trigger:hover { box-shadow: 0 0 0 1px var(--line-2) inset; }
    .trigger span { flex: 1; }
    .trigger kbd + kbd { margin-left: -6px; }
    .demo[data-density="compact"] .trigger { height: 40px; margin: 14px 0 16px; }

    .log__head { margin-bottom: 8px; color: var(--faint); font-size: 12px; font-weight: 500; }
    .log li {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }
    .demo[data-density="compact"] .log li { padding: 5px 0; }
    .log li .ico { width: 16px; height: 16px; color: var(--dim); }
    .log li span { flex: 1; }
    .log li time { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .log__empty { color: var(--faint); font-size: 13px; padding: 9px 0; border-top: 1px solid var(--line); }

    /* =========================================================
       Command palette
       ========================================================= */
    .cp {
      width: min(640px, calc(100vw - 24px));
      max-height: none;
      margin: 12vh auto auto;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      overflow: visible;
    }
    .cp::backdrop { background: #1d1b1666; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
    :root[data-theme="dark"] .cp::backdrop { background: #00000080; }

    .cp__panel {
      display: flex; flex-direction: column;
      max-height: min(560px, 76vh);
      border-radius: 22px;
      background: var(--solid);
      box-shadow: 0 40px 80px -30px #28200a8c, 0 0 0 1px var(--hair) inset, 0 0 0 1px var(--line);
      overflow: hidden;
    }

    .cp__bar {
      display: flex; align-items: center; gap: 8px;
      padding: 0 14px 0 16px;
      border-bottom: 1px solid var(--line);
    }
    .cp__bar > .ico { color: var(--faint); }
    .cp__crumbs { display: flex; gap: 4px; }
    .cp__crumb-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--honey-2); color: var(--honey-ink);
      font-size: 12px; font-weight: 500; white-space: nowrap;
    }
    .cp__input {
      flex: 1; min-width: 0;
      height: 56px;
      border: 0; outline: 0;
      background: transparent;
      font-size: 16px;
    }
    .cp__input::placeholder { color: var(--faint); }

    .cp__list { position: relative; flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 6px; scroll-padding: 8px; }
    .cp__hl {
      position: absolute; left: 6px; right: 6px; top: 0;
      height: 0;
      border-radius: 12px;
      background: var(--hl);
      box-shadow: inset 3px 0 0 var(--honey);
      pointer-events: none;
      transition: transform .18s var(--ease), height .18s var(--ease), opacity .15s;
    }
    .cp__group { padding: 10px 10px 4px; color: var(--faint); font-size: 11.5px; font-weight: 500; }

    .cp__row {
      position: relative;
      display: flex; align-items: center; gap: 12px;
      min-height: 44px;
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
    }
    .cp__ico {
      width: 30px; height: 30px; flex: none;
      display: grid; place-items: center;
      border-radius: 9px;
      background: var(--card-2);
      box-shadow: 0 0 0 1px var(--line) inset;
      color: var(--dim);
    }
    .cp__ico .ico { width: 16px; height: 16px; }
    .cp__row[aria-selected="true"] .cp__ico { color: var(--ink); }
    .cp__txt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .cp__path { color: var(--faint); }
    .cp__title mark { background: none; color: inherit; font-weight: 600; box-shadow: inset 0 -2px 0 var(--honey); }
    .cp__hint { margin-left: 8px; color: var(--faint); font-size: 12px; }
    .cp__meta { display: flex; align-items: center; gap: 4px; flex: none; color: var(--faint); }
    .cp__meta .ico { width: 16px; height: 16px; }
    .cp__check { color: var(--honey-ink); }
    :root[data-theme="dark"] .cp__check { color: var(--honey); }

    .cp__empty { padding: 34px 16px; text-align: center; color: var(--dim); font-size: 13px; }
    .cp__empty b { color: var(--ink); font-weight: 500; }

    .cp__foot {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      color: var(--faint); font-size: 11.5px;
    }
    .cp__foot span { display: inline-flex; align-items: center; gap: 5px; }
    .cp__count { margin-left: auto; font-variant-numeric: tabular-nums; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; left: 0; right: 0; bottom: 26px; z-index: 30;
      width: fit-content; max-width: calc(100vw - 32px); margin: 0 auto;
      padding: 12px 18px; border-radius: 999px;
      background: var(--night); color: var(--night-ink);
      font-size: 13px; font-weight: 500;
      box-shadow: 0 20px 40px -20px #0009;
      opacity: 0; transform: translateY(18px) scale(.96);
      pointer-events: none;
      transition: opacity .3s, transform .45s var(--back);
    }
    .toast.is-on { opacity: 1; transform: none; }

    @media (max-width: 560px) {
      .cp { margin-top: 10px; }
      .cp__foot span:not(.cp__count) { display: none; }
      .cp__count { margin-left: 0; }
      .cp__hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cp__hl, .toast, .demo { transition: none; }
    }
  </style>
</head>
<body>

  </svg>

  <!-- ===================== Demo surface ===================== -->
  <main class="demo" data-demo>
    <h1 class="demo__title" data-greet>Good afternoon</h1>
    <p class="demo__sub"><span data-l="page">Page</span>: <b data-page>Overview</b> · <span data-l="theme">Theme</span>: <b data-theme-label>Light</b></p>

    <button class="trigger" type="button" data-open-palette aria-haspopup="dialog">
      <svg class="ico"><use href="#i-search"/></svg>
      <span data-l="search">Search or run a command…</span>
      <kbd data-mod>⌘</kbd><kbd>K</kbd>
    </button>

    <p class="log__head" data-l="recent">Recent actions</p>
    <ul class="log" data-log aria-live="polite"></ul>
  </main>

  <!-- ===================== Command palette ===================== -->
  <dialog class="cp" aria-label="Command palette">
    <div class="cp__panel">
      <div class="cp__bar">
        <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
        <span class="cp__crumbs" data-crumbs></span>
        <input class="cp__input" type="text" role="combobox" aria-expanded="true" aria-controls="cp-list" aria-autocomplete="list"
               autocomplete="off" spellcheck="false" placeholder="Type a command or search…" />
        <kbd>esc</kbd>
      </div>
      <div class="cp__list" id="cp-list" role="listbox" aria-label="Commands">
        <span class="cp__hl" aria-hidden="true"></span>
        <div data-rows></div>
      </div>
      <footer class="cp__foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> select</span>
        <span><kbd>⌫</kbd> back</span>
        <span class="cp__count" data-count aria-live="polite"></span>
      </footer>
    </div>
  </dialog>

  <div class="toast" role="status" aria-live="polite"></div>

  <script>
  /* =============================================================
     CommandPalette — reusable core. Copy this block (plus the .cp
     markup and styles) into any app, then call register().

     Command shape:
       { id, title, section?, icon?, keywords?: [], hint?, shortcut?: 'mod+shift+k',
         run?(api), children?: [] | () => [], checked?: () => bool, keepOpen?: bool }
     api: { close, toast, push(title, items) }
     ============================================================= */
  window.CommandPalette = (() => {
    const dlg = document.querySelector('.cp');
    const input = dlg.querySelector('.cp__input');
    const list = dlg.querySelector('.cp__list');
    const rowsEl = dlg.querySelector('[data-rows]');
    const hl = dlg.querySelector('.cp__hl');
    const crumbs = dlg.querySelector('[data-crumbs]');
    const countEl = dlg.querySelector('[data-count]');
    const toastEl = document.querySelector('.toast');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const isMac = /Mac|iPhone|iPad|iPod/i.test(navigator.platform || navigator.userAgent);
    const RECENT_KEY = 'command-palette:recent';
    const FREQ_KEY = 'command-palette:freq';
    const MAX_RECENT = 5;

    let commands = [];
    const byPath = new Map();
    let stack = [];      // pushed pages: { title, items }
    let view = [];       // rendered rows: { item, crumb, idx }
    let active = 0;
    let returnFocus = null;

    const read = (k, fb) => { try { return JSON.parse(localStorage.getItem(k) || 'null') ?? fb; } catch { return fb; } };
    const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
    let recent = read(RECENT_KEY, []);
    let freq = read(FREQ_KEY, {});
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    /* ---------- Registry ---------- */
    function index(items, parent) {
      items.forEach((it) => {
        it._parent = parent || null;
        it._path = parent ? `${parent._path}/${it.id}` : it.id;
        byPath.set(it._path, it);
        if (Array.isArray(it.children)) index(it.children, it);
      });
    }
    function register(list) {
      commands = list;
      byPath.clear();
      index(commands);
    }
    const kids = (it) => (typeof it.children === 'function' ? it.children() : it.children || []);
    const crumbOf = (it) => { const t = []; for (let p = it._parent; p; p = p._parent) t.unshift(p.title); return t.join(' › '); };
    function flatten(items, out = []) {
      items.forEach((it) => { out.push(it); if (Array.isArray(it.children)) flatten(it.children, out); });
      return out;
    }

    /* ---------- Fuzzy match ---------- */
    // Subsequence match with bonuses for word starts, runs and prefixes. Returns { score, hits } or null.
    function fuzzy(q, text) {
      const t = text.toLowerCase();
      let from = 0, prev = -2, score = 0;
      const hits = [];
      for (const ch of q) {
        if (ch === ' ') continue;
        const i = t.indexOf(ch, from);
        if (i < 0) return null;
        score += 1;
        if (i === prev + 1) score += 5;
        if (i === 0 || /[\s\-_/›&]/.test(t[i - 1])) score += 8;
        score -= Math.min(i - from, 12) * 0.15;
        hits.push(i);
        prev = i; from = i + 1;
      }
      const flat = q.replace(/\s+/g, ' ');
      if (t.startsWith(flat)) score += 25;
      else if (t.includes(flat)) score += 12;
      return { score: score - t.length * 0.02, hits };
    }
    function match(q, it) {
      const m = fuzzy(q, it.title);
      let best = m ? { score: m.score, hits: m.hits } : null;
      for (const k of it.keywords || []) {
        const km = fuzzy(q, k);
        if (km && (!best || km.score - 4 > best.score)) best = { score: km.score - 4, hits: [] };
      }
      if (!best && it._parent) {
        const pm = fuzzy(q, `${crumbOf(it)} ${it.title}`);
        if (pm) best = { score: pm.score - 6, hits: [] };
      }
      if (best) best.score += Math.log2(1 + (freq[it._path] || 0)) * 2;
      return best;
    }
    function highlight(text, hits) {
      if (!hits.length) return esc(text);
      const set = new Set(hits);
      return [...text].map((c, i) => (set.has(i) ? `<mark>${esc(c)}</mark>` : esc(c))).join('');
    }

    /* ---------- Shortcuts ---------- */
    const SYMBOLS = isMac ? { mod: '⌘', shift: '⇧', alt: '⌥' } : { mod: 'Ctrl', shift: 'Shift', alt: 'Alt' };
    const keysOf = (combo) => combo.split('+').map((k) => SYMBOLS[k] || k.toUpperCase());
    function comboOf(e) {
      const parts = [];
      if (isMac ? e.metaKey : e.ctrlKey) parts.push('mod');
      if (e.altKey) parts.push('alt');
      if (e.shiftKey) parts.push('shift');
      let key = e.key.toLowerCase();
      if (/^Key[A-Z]$/.test(e.code)) key = e.code.slice(3).toLowerCase();
      else if (/^Digit\d$/.test(e.code)) key = e.code.slice(5);
      parts.push(key);
      return parts.join('+');
    }

    /* ---------- Build the visible list ---------- */
    function compute() {
      const q = input.value.trim().toLowerCase();
      const page = stack[stack.length - 1];
      const scope = page ? page.items : commands;
      const groups = [];

      if (!q) {
        if (!page) {
          const rec = recent.map((p) => byPath.get(p)).filter(Boolean);
          if (rec.length) groups.push({ title: 'Recent', rows: rec.map((it) => ({ item: it, crumb: crumbOf(it), hits: [] })) });
          const order = [];
          scope.forEach((it) => { const s = it.section || 'Commands'; if (!order.includes(s)) order.push(s); });
          order.forEach((s) => groups.push({ title: s, rows: scope.filter((it) => (it.section || 'Commands') === s).map((it) => ({ item: it, crumb: '', hits: [] })) }));
        } else {
          groups.push({ title: '', rows: scope.map((it) => ({ item: it, crumb: '', hits: [] })) });
        }
      } else {
        const pool = page ? scope : flatten(scope);
        const scored = pool
          .map((it) => ({ it, m: match(q, it) }))
          .filter((x) => x.m)
          .sort((a, b) => b.m.score - a.m.score)
          .slice(0, 40);
        if (scored.length) groups.push({ title: 'Best matches', rows: scored.map(({ it, m }) => ({ item: it, crumb: page ? '' : crumbOf(it), hits: m.hits })) });
      }
      return groups;
    }

    function render(animate = false) {
      const groups = compute();
      view = [];
      let html = '';
      groups.forEach((g) => {
        if (g.title) html += `<p class="cp__group" role="presentation">${esc(g.title)}</p>`;
        g.rows.forEach((r) => {
          const i = view.length;
          view.push(r);
          const it = r.item;
          const checked = it.checked?.();
          const meta = [
            checked ? '<svg class="ico cp__check" aria-hidden="true"><use href="#i-check"/></svg>' : '',
            it.shortcut ? keysOf(it.shortcut).map((k) => `<kbd>${esc(k)}</kbd>`).join('') : '',
            it.children ? '<svg class="ico" aria-hidden="true"><use href="#i-chev-r"/></svg>' : '',
          ].join('');
          html += `<div class="cp__row" role="option" id="cp-opt-${i}" data-i="${i}" aria-selected="false"${checked ? ' aria-checked="true"' : ''}>
            <span class="cp__ico" aria-hidden="true"><svg class="ico"><use href="#i-${esc(it.icon || 'chev-r')}"/></svg></span>
            <span class="cp__txt">${r.crumb ? `<span class="cp__path">${esc(r.crumb)} › </span>` : ''}<span class="cp__title">${highlight(it.title, r.hits)}</span>${it.hint ? `<span class="cp__hint">${esc(it.hint)}</span>` : ''}</span>
            <span class="cp__meta">${meta}</span>
          </div>`;
        });
      });
      if (!view.length) {
        html = `<p class="cp__empty">No commands match <b>“${esc(input.value.trim())}”</b>.<br>Try fewer letters, or press ⌫ to go back.</p>`;
      }
      rowsEl.innerHTML = html;
      countEl.textContent = view.length ? `${view.length} ${view.length === 1 ? 'result' : 'results'}` : 'No results';
      hl.style.opacity = view.length ? 1 : 0;
      setActive(0, { animate: false });

      if (animate && !reduce.matches) {
        rowsEl.querySelectorAll('.cp__row').forEach((row, i) => {
          if (i > 9) return;
          row.animate([{ opacity: 0, transform: 'translateY(4px)' }, { opacity: 1, transform: 'none' }],
            { duration: 220, delay: i * 14, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' });
        });
      }
    }

    function setActive(i, { animate = true, scroll = true } = {}) {
      if (!view.length) { input.removeAttribute('aria-activedescendant'); return; }
      active = (i + view.length) % view.length;
      rowsEl.querySelectorAll('.cp__row').forEach((r) => r.setAttribute('aria-selected', String(+r.dataset.i === active)));
      const row = rowsEl.querySelector(`[data-i="${active}"]`);
      input.setAttribute('aria-activedescendant', row.id);
      if (!animate || reduce.matches) hl.style.transition = 'none';
      hl.style.height = `${row.offsetHeight}px`;
      hl.style.transform = `translateY(${row.offsetTop}px)`;
      if (!animate || reduce.matches) { hl.getBoundingClientRect(); hl.style.transition = ''; }
      if (scroll) row.scrollIntoView({ block: 'nearest' });
    }

    function renderCrumbs() {
      crumbs.innerHTML = stack.map((p) => `<span class="cp__crumb-chip">${esc(p.title)}</span>`).join('');
      input.placeholder = stack.length ? `Search ${stack[stack.length - 1].title.toLowerCase()}…` : 'Type a command or search…';
    }

    /* ---------- Pages ---------- */
    function push(title, items) {
      stack.push({ title, items });
      input.value = '';
      renderCrumbs();
      render();
      slide(1);
    }
    function pop() {
      if (!stack.length) return false;
      stack.pop();
      input.value = '';
      renderCrumbs();
      render();
      slide(-1);
      return true;
    }
    function slide(dir) {
      if (reduce.matches) return;
      rowsEl.animate([{ opacity: 0, transform: `translateX(${dir * 16}px)` }, { opacity: 1, transform: 'none' }],
        { duration: 220, easing: 'cubic-bezier(.22,1,.36,1)' });
    }

    /* ---------- Running ---------- */
    function remember(it) {
      recent = [it._path, ...recent.filter((p) => p !== it._path)].slice(0, MAX_RECENT);
      freq[it._path] = (freq[it._path] || 0) + 1;
      write(RECENT_KEY, recent);
      write(FREQ_KEY, freq);
    }
    const api = { close: () => close(), toast: (m) => toast(m), push: (t, items) => push(t, items) };

    function run(it) {
      if (!it) return;
      if (it.children) { push(it.title, kids(it)); return; }
      remember(it);
      if (!it.keepOpen) close();
      it.run?.(api);
      if (it.keepOpen && dlg.open) render();
    }

    /* ---------- Open / close ---------- */
    function open(initial = '') {
      if (dlg.open) return;
      returnFocus = document.activeElement;
      stack = [];
      input.value = initial;
      renderCrumbs();
      dlg.showModal();
      render(true);
      input.focus();
      if (!reduce.matches) {
        dlg.animate([{ opacity: 0, transform: 'translateY(-10px) scale(.97)' }, { opacity: 1, transform: 'none' }],
          { duration: 260, easing: 'cubic-bezier(.34,1.4,.64,1)' });
      }
    }
    function close() {
      if (!dlg.open) return;
      const done = () => { dlg.close(); returnFocus?.focus?.(); };
      if (reduce.matches) return done();
      dlg.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-6px) scale(.98)' }],
        { duration: 140, easing: 'ease-in' }).onfinish = done;
    }
    const toggle = () => (dlg.open ? close() : open());

    let toastTimer;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('is-on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('is-on'), 2400);
    }

    /* ---------- Events ---------- */
    input.addEventListener('input', () => render());
    input.addEventListener('keydown', (e) => {
      if (e.isComposing) return; // IME (e.g. Japanese input) is choosing a candidate
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
      else if (e.key === 'PageDown') { e.preventDefault(); setActive(Math.min(view.length - 1, active + 6)); }
      else if (e.key === 'PageUp') { e.preventDefault(); setActive(Math.max(0, active - 6)); }
      else if (e.key === 'Enter') { e.preventDefault(); run(view[active]?.item); }
      else if (e.key === 'Tab') { e.preventDefault(); const it = view[active]?.item; if (it?.children) run(it); }
      else if (e.key === 'Backspace' && !input.value && stack.length) { e.preventDefault(); pop(); }
    });
    dlg.addEventListener('cancel', (e) => { e.preventDefault(); if (!pop()) close(); });
    dlg.addEventListener('click', (e) => { if (e.target === dlg) close(); }); // backdrop
    rowsEl.addEventListener('pointermove', (e) => {
      const row = e.target.closest('.cp__row');
      if (row && +row.dataset.i !== active) setActive(+row.dataset.i, { scroll: false });
    });
    rowsEl.addEventListener('click', (e) => {
      const row = e.target.closest('.cp__row');
      if (row) run(view[+row.dataset.i].item);
    });

    document.addEventListener('keydown', (e) => {
      const combo = comboOf(e);
      if (combo === 'mod+k') { e.preventDefault(); toggle(); return; }
      const typing = e.target.closest?.('input, textarea, [contenteditable="true"]');
      if (e.key === '/' && !typing && !dlg.open) { e.preventDefault(); open(); return; }
      if (e.isComposing) return;
      const hit = flatten(commands).find((it) => it.shortcut === combo);
      if (hit && !(typing && !combo.includes('mod') && !combo.includes('alt'))) {
        e.preventDefault();
        remember(hit);
        if (dlg.open && !hit.keepOpen) close();
        hit.run?.(api);
        if (dlg.open) render();
      }
    });

    return { register, open, close, toggle, toast, isMac, keysOf };
  })();
  </script>

  <script>
  /* =============================================================
     Demo commands — replace with your app's own.
     ============================================================= */
  (() => {
    const P = window.CommandPalette;
    const demo = document.querySelector('[data-demo]');
    const logEl = document.querySelector('[data-log]');
    const KEY = 'command-palette:demo';
    let state = { theme: 'light', density: 'comfortable', lang: 'en', page: 'Overview' };
    try { state = { ...state, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

    const COPY = {
      en: { morning: 'Good morning', afternoon: 'Good afternoon', evening: 'Good evening', page: 'Page', theme: 'Theme', search: 'Search or run a command…', recent: 'Recent actions', empty: 'Nothing yet. Press ⌘K and try “dark”.' },
      ja: { morning: 'おはようございます', afternoon: 'こんにちは', evening: 'こんばんは', page: 'ページ', theme: 'テーマ', search: 'コマンドを検索・実行…', recent: '最近の操作', empty: 'まだありません。⌘K を押して「dark」と入力してみてください。' },
    };
    const PAGES = { Overview: 'home', People: 'users', Payroll: 'wallet', Calendar: 'calendar' };
    const THEMES = { light: 'Light', dark: 'Dark', system: 'System' };

    let log = [];
    function note(icon, text) {
      log = [{ icon, text, at: new Date() }, ...log].slice(0, 6);
      paint();
    }

    function applyTheme() {
      const t = state.theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : state.theme;
      document.documentElement.dataset.theme = t;
    }
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.theme === 'system') applyTheme(); });

    function paint() {
      const c = COPY[state.lang];
      const h = new Date().getHours();
      document.documentElement.lang = state.lang;
      document.querySelector('[data-greet]').textContent = h < 12 ? c.morning : h < 18 ? c.afternoon : c.evening;
      document.querySelectorAll('[data-l]').forEach((el) => { el.textContent = c[el.dataset.l]; });
      document.querySelector('[data-page]').textContent = state.page;
      document.querySelector('[data-theme-label]').textContent = THEMES[state.theme];
      document.querySelector('[data-mod]').textContent = P.isMac ? '⌘' : 'Ctrl';
      demo.dataset.density = state.density;
      const fmt = (d) => d.toLocaleTimeString(state.lang === 'ja' ? 'ja-JP' : 'en-US', { hour: '2-digit', minute: '2-digit' });
      logEl.innerHTML = log.length
        ? log.map((l) => `<li><svg class="ico"><use href="#i-${l.icon}"/></svg><span>${l.text}</span><time>${fmt(l.at)}</time></li>`).join('')
        : `<li class="log__empty">${P.isMac ? c.empty : c.empty.replace('⌘K', 'Ctrl K')}</li>`;
    }

    const set = (key, value, label, icon) => () => {
      state[key] = value;
      save();
      if (key === 'theme') applyTheme();
      note(icon, label);
      P.toast(label);
    };

    const go = (page) => ({
      id: `go-${page.toLowerCase()}`, title: `Go to ${page}`, section: 'Navigate', icon: PAGES[page],
      keywords: [page, 'open', 'navigate', 'page'], shortcut: `alt+${Object.keys(PAGES).indexOf(page) + 1}`,
      run: () => { state.page = page; save(); note(PAGES[page], `Opened ${page}`); },
    });

    P.register([
      ...Object.keys(PAGES).map(go),

      { id: 'new-invoice', title: 'New invoice', section: 'Create', icon: 'file-plus', keywords: ['bill', 'payment', 'create'],
        run: (api) => { note('file-plus', 'Started a new invoice'); api.toast('New invoice — this is where your form would open'); } },
      { id: 'invite', title: 'Invite teammate', section: 'Create', icon: 'user-plus', keywords: ['add', 'member', 'people', 'user'],
        run: (api) => { note('user-plus', 'Opened the invite form'); api.toast('Invite teammate — your form would open here'); } },

      { id: 'copy-link', title: 'Copy link to this page', section: 'Actions', icon: 'link', keywords: ['url', 'share', 'clipboard'], shortcut: 'alt+shift+c',
        run: async (api) => {
          try { await navigator.clipboard.writeText(location.href); api.toast('Link copied'); }
          catch { api.toast('Couldn’t reach the clipboard here'); }
          note('link', 'Copied the page link');
        } },
      { id: 'focus-timer', title: 'Start a 25-minute focus timer', section: 'Actions', icon: 'timer', keywords: ['pomodoro', 'timer', 'focus'],
        run: (api) => {
          const end = new Date(Date.now() + 25 * 60000);
          note('timer', `Focus timer until ${end.toLocaleTimeString(state.lang === 'ja' ? 'ja-JP' : 'en-US', { hour: '2-digit', minute: '2-digit' })}`);
          api.toast('Focus timer started — 25 minutes');
        } },

      { id: 'toggle-dark', title: 'Toggle dark mode', section: 'Preferences', icon: 'moon', keywords: ['theme', 'light', 'night', 'appearance'], shortcut: 'alt+d',
        checked: () => document.documentElement.dataset.theme === 'dark',
        run: () => { const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; set('theme', next, `Theme: ${THEMES[next]}`, next === 'dark' ? 'moon' : 'sun')(); } },
      { id: 'theme', title: 'Change theme', section: 'Preferences', icon: 'palette', keywords: ['appearance', 'color', 'mode'],
        children: [
          { id: 'light', title: 'Light', icon: 'sun', checked: () => state.theme === 'light', run: set('theme', 'light', 'Theme: Light', 'sun') },
          { id: 'dark', title: 'Dark', icon: 'moon', checked: () => state.theme === 'dark', run: set('theme', 'dark', 'Theme: Dark', 'moon') },
          { id: 'system', title: 'Match system', icon: 'monitor', keywords: ['auto', 'os'], checked: () => state.theme === 'system', run: set('theme', 'system', 'Theme: System', 'monitor') },
        ] },
      { id: 'density', title: 'Change density', section: 'Preferences', icon: 'rows', keywords: ['spacing', 'compact', 'layout'],
        children: [
          { id: 'comfortable', title: 'Comfortable', icon: 'rows', checked: () => state.density === 'comfortable', run: set('density', 'comfortable', 'Density: Comfortable', 'rows') },
          { id: 'compact', title: 'Compact', icon: 'rows', checked: () => state.density === 'compact', run: set('density', 'compact', 'Density: Compact', 'rows') },
        ] },
      { id: 'language', title: 'Change language', section: 'Preferences', icon: 'globe', keywords: ['locale', 'japanese', 'english', '言語'],
        children: [
          { id: 'en', title: 'English', icon: 'globe', checked: () => state.lang === 'en', run: set('lang', 'en', 'Language: English', 'globe') },
          { id: 'ja', title: '日本語', hint: 'Japanese', icon: 'globe', keywords: ['japanese', 'nihongo'], checked: () => state.lang === 'ja', run: set('lang', 'ja', '言語：日本語', 'globe') },
        ] },

      { id: 'shortcuts', title: 'Keyboard shortcuts', section: 'Help', icon: 'keyboard', keywords: ['keys', 'hotkeys', 'help'],
        children: () => [
          { id: 'open', title: 'Open this palette', icon: 'search', shortcut: 'mod+k', keepOpen: true },
          { id: 'slash', title: 'Open from anywhere', icon: 'search', hint: 'when not typing', shortcut: '/', keepOpen: true },
          { id: 'nav', title: 'Go to a page', icon: 'home', hint: 'Overview, People, Payroll, Calendar', shortcut: 'alt+1', keepOpen: true },
          { id: 'dark', title: 'Toggle dark mode', icon: 'moon', shortcut: 'alt+d', keepOpen: true },
          { id: 'copy', title: 'Copy link to this page', icon: 'link', shortcut: 'alt+shift+c', keepOpen: true },
        ] },
      { id: 'support', title: 'Contact support', section: 'Help', icon: 'help', keywords: ['help', 'email', 'bug'],
        run: (api) => { note('help', 'Opened support'); api.toast('Support — this is where your help link goes'); } },
    ]);

    document.querySelector('[data-open-palette]').addEventListener('click', () => P.open());
    applyTheme();
    paint();
  })();
  </script>
